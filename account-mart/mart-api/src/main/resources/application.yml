server:
  port: 8085

spring:
  application:
    name: risk-data-mart-api
  
  # 🔑 [Centralized Config] 설정 서버 연동
  config:
    import: "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.ho.account.mart: DEBUG
