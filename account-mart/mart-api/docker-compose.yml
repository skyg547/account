version: '3.8'

services:
  ifrs9-allowance-mart-api:
    build:
      context: ../..
      dockerfile: account-mart/mart-api/Dockerfile
    container_name: ifrs9-allowance-mart-api
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${ACCOUNT_MART_DB_URL:?set ACCOUNT_MART_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${ACCOUNT_MART_DB_USER:?set ACCOUNT_MART_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${ACCOUNT_MART_DB_PASSWORD:?set ACCOUNT_MART_DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_BATCH_JDBC_PLATFORM=postgresql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
    networks:
      - allowance-network

networks:
  allowance-network:
    external: true
    name: allowance-network
