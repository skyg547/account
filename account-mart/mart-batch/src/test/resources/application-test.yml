spring:
  datasource:
    url: jdbc:h2:mem:risk_data_mart_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  batch:
    job:
      enabled: false
  cloud:
    discovery:
      enabled: false
  main:
    web-application-type: none

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

mart:
  batch:
    cdm-load:
      parallel-enabled: false
    bootstrap:
      enabled: false
    demo-seed:
      enabled: true
    cdm-event:
      enabled: false
