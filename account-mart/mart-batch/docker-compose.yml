version: '3.8'

services:
  ifrs9-allowance-mart-batch:
    build:
      context: ../..
      dockerfile: Containerfile
      args:
        GRADLE_PROJECT: ":account-mart:mart-batch"
        JAR_DIRECTORY: account-mart/mart-batch
    container_name: ifrs9-allowance-mart-batch
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${ACCOUNT_MART_DB_URL:?set ACCOUNT_MART_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${ACCOUNT_MART_DB_USER:?set ACCOUNT_MART_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${ACCOUNT_MART_DB_PASSWORD:?set ACCOUNT_MART_DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-service:8761/eureka/
    networks:
      - allowance-network
    restart: "no"

networks:
  allowance-network:
    external: true
    name: allowance-network
