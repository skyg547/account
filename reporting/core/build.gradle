plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'account-reporting-core'
group = 'com.ho.reporting'

base {
    archivesName = 'account-reporting-core'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    api project(':contracts')
    api project(':shared-kernel')
    api project(':master-data:core')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

jar {
    enabled = true
}

tasks.named('processTestResources') {
    // Copy the owned production migrations: dependency modules also publish db/migration.
    from('src/main/resources/db/migration') {
        include 'V60__reporting_persistence_schema.sql',
                'V61__reporting_regulatory_submission.sql',
                'V62__reporting_disclosure_note_mart.sql',
                'V63__reporting_regulatory_filing.sql'
        into 'db/reporting-test-migration'
    }
}

