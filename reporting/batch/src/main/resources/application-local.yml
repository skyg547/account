# ==============================================================================
# Reporting Batch Module - Local Active Profile Configuration
# ==============================================================================
# [Architecture & Pedagogical Explanation]
# 1. Profile Separation (프로파일 분리)
#    - local 프로파일은 개발자의 로컬 환경 및 독립적인 배치 런타임 테스트 환경을 위해 정의된 명시적 프로파일입니다.
#    - 개발/운영 환경의 외부 PostgreSQL DB 및 인프라 제어 서버(Config, Discovery 등)에 의존하지 않는
#      독립 단독 런타임(Self-contained Local Runtime)을 보장합니다.
#
# 2. Local Self-Contained Persistence Mode (독립 로컬 런타임 메모리 모드)
#    - account.reporting.persistence.mode=memory 설정을 적용하여 외부 journal-ledger 서비스 또는
#      LedgerQueryPort 빈 연동 없이 InMemoryLedgerBalanceAdapter 및 InMemoryJournalQueryAdapter가
#      자동 선택되도록 구성함으로써 배치 모듈의 로컬 단독 구동을 보장합니다.
#
# 3. Web Environment Disabled (서블릿 컨테이너 비활성화)
#    - spring.main.web-application-type: none 설정을 통해 배치 프로세스가 불필요한 Web Server(Tomcat 등)를
#      구동하지 않도록 구성을 차단하여 배치 프로세스로서의 경량화된 실행 환경을 보장합니다.
#
# 4. Automatic Batch Scheduler Prevention (비동기 배치 스케줄러 자동 실행 방지)
#    - spring.batch.job.enabled: false 설정은 Spring Boot 시작 시 등록된 모든 Job이 자동으로 수행되는 것을 방지합니다.
#    - 로컬 런타임 구동 시 원치 않는 비즈니스 배치 Job이 실행되어 DB 상태를 오염시키거나 시스템 자원을 과도하게 사용하는 위험을 차단하며,
#      특정 Job 실행 시에는 CLI 인자(--spring.batch.job.name=...)나 특정 트리거를 통해서만 명시적으로 구동할 수 있습니다.
#
# 5. Batch Meta-schema Initialization (배치 메타데이터 초기화)
#    - spring.batch.jdbc.initialize-schema: always 설정으로 H2 인메모리 환경에 Spring Batch 메타데이터 테이블
#      (BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION 등)을 자동 구축합니다.
#
# 6. In-memory H2 & JPA Strategy (인메모리 H2 및 JPA)
#    - jdbc:h2:mem:reporting_batch_db 데이터소스를 사용하여 외부 DB 의존성을 격리합니다.
#    - JPA ddl-auto: create-drop 설정을 적용하여 로컬 구동 시 인메모리 도메인 테이블 생성을 자동화합니다.
# ==============================================================================

account:
  reporting:
    persistence:
      mode: memory

spring:
  config:
    activate:
      on-profile: local
  main:
    web-application-type: none
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:mem:reporting_batch_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: never
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false
