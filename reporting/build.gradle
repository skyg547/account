description = 'account-reporting'

// Parent project for reporting submodules.
// Runtime code lives in:
// - :reporting:core
// - :reporting:api
// - :reporting:batch
// The parent has no test sources; make the module-level verification command run all three suites.
tasks.named('test') {
    dependsOn ':reporting:core:test', ':reporting:api:test', ':reporting:batch:test'
}
