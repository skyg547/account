# ==============================================================================
# Reporting API Module - Local Active Profile Configuration
# ==============================================================================
# [Architecture & Pedagogical Explanation]
# 1. Profile Separation (프로파일 분리)
#    - local 프로파일은 개발자의 로컬 개발 환경 및 독립적인(Self-contained) 런타임 환경을 제공합니다.
#    - dev/prod 프로파일에서 요구하는 외부 PostgreSQL DB 접속 정보(DEV_DB_HOST 등)나 Config Server,
#      Discovery (Eureka) 등 외부 인프라 자원 연동 없이 단독으로 안전하게 구동할 수 있습니다.
#
# 2. Local Self-Contained Persistence Mode (독립 로컬 런타임 메모리 모드)
#    - account.reporting.persistence.mode=memory 설정을 적용하여 외부 journal-ledger 서비스 또는
#      LedgerQueryPort 빈 연동 없이 InMemoryLedgerBalanceAdapter 및 InMemoryJournalQueryAdapter가
#      자동 선택되도록 구성함으로써 독립 단독 실행(Self-contained Local Runtime)을 보장합니다.
#
# 3. In-memory H2 DB Isolation (로컬 H2 인메모리 실행 격리)
#    - 별도의 외부 DB 설치 및 접속 없이 로컬 개발과 테스트가 가능하도록 H2 인메모리 데이터베이스를 사용합니다.
#    - MODE=PostgreSQL 옵션을 적용하여 PostgreSQL과의 쿼리/표준 호환성을 보장합니다.
#    - spring.jpa.hibernate.ddl-auto=create-drop 설정을 적용하여 애플리케이션 시작 시 엔티티 기반 스키마를 생성하고
#      종료 시 깔끔하게 삭제(drop)함으로써 데이터 테스트 격리성(Test Isolation)을 확보합니다.
#
# 4. External Infrastructure Decoupling (외부 제어 서버 연동 무효화)
#    - Spring Cloud Config, Eureka Discovery, Vault, Tracing(Zipkin 등)을 비활성화하여
#      로컬 단독 실행(Self-contained Local Runtime) 환경에서 외부 통신 실패나 예외 발생을 미연에 차단합니다.
# ==============================================================================

account:
  reporting:
    persistence:
      mode: memory

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:reporting_api_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: never
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false
