spring:
  application:
    name: account
  profiles:
    active: local # 기본 활성 프로파일 (local)

  # JPA 공통 설정
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false # OSIV 비활성화 (성능 최적화)
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅
        use_sql_comments: true # SQL 주석 표시

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080 # 기본 포트

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
