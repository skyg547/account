plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

description = 'account-app'

dependencies {
    implementation project(':contracts')
    implementation project(':shared-kernel')
    implementation project(':master-data')
    implementation project(':governance')
    implementation project(':journal-ledger:core')
    implementation project(':closing')
    implementation project(':loan')
    implementation project(':reconciliation')
    implementation project(':receivable')
    implementation project(':payable')
    implementation project(':asset-lease')
    implementation project(':tax')
    implementation project(':expenditure-resolution')
    implementation project(':reporting')

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.annotation:jakarta.annotation-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':journal-ledger:api')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'com.ho.account.AccountApplication'
}
