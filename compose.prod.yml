name: account-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-environment: &common-environment
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery:8761/eureka/
  PROD_KAFKA_BOOTSTRAP_SERVERS: "${PROD_KAFKA_BOOTSTRAP_SERVERS:?set PROD_KAFKA_BOOTSTRAP_SERVERS}"
  PROD_REDIS_HOST: "${PROD_REDIS_HOST:?set PROD_REDIS_HOST}"
  PROD_REDIS_PORT: "${PROD_REDIS_PORT:?set PROD_REDIS_PORT}"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_OPEN_IN_VIEW: "false"
  # Schema changes run in a separately approved release migration with a
  # dedicated credential. Long-running application containers only validate.
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_FLYWAY_CLEAN_DISABLED: "true"
  SPRING_SQL_INIT_MODE: never
  SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: never

x-api-service: &api-service
  profiles: ["prod"]
  restart: unless-stopped
  read_only: true
  init: true
  pids_limit: 256
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  stop_grace_period: 30s
  logging: *default-logging
  networks: [account-prod]
  depends_on:
    config-server:
      condition: service_healthy
    discovery:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 60s
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 1g
      reservations:
        memory: 256m

x-batch-service: &batch-service
  profiles: ["batch"]
  restart: "no"
  read_only: true
  init: true
  pids_limit: 512
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=256m,mode=1777
  stop_grace_period: 2m
  logging: *default-logging
  networks: [account-prod]
  depends_on:
    config-server:
      condition: service_healthy
    discovery:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "2.00"
        memory: 2g
      reservations:
        memory: 512m

services:
  config-server:
    profiles: ["prod", "batch"]
    image: "${CONFIG_SERVER_IMAGE:?set immutable CONFIG_SERVER_IMAGE digest}"
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
      SERVER_PORT: "8888"
    volumes:
      - type: bind
        source: "${PROD_CONFIG_REPO_PATH:?set PROD_CONFIG_REPO_PATH}"
        target: /config-repo
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *default-logging
    networks: [account-prod]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768m
        reservations:
          memory: 256m

  discovery:
    profiles: ["prod", "batch"]
    image: "${DISCOVERY_IMAGE:?set immutable DISCOVERY_IMAGE digest}"
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SERVER_PORT: "8761"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    logging: *default-logging
    networks: [account-prod]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768m
        reservations:
          memory: 256m

  gateway:
    profiles: ["prod"]
    image: "${GATEWAY_IMAGE:?set immutable GATEWAY_IMAGE digest}"
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8000"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
    ports:
      - "${PROD_GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    logging: *default-logging
    networks: [account-prod]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g
        reservations:
          memory: 256m

  frontend:
    profiles: ["prod"]
    image: "${FRONTEND_IMAGE:?set immutable FRONTEND_IMAGE digest}"
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${PROD_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    networks: [account-prod]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512m
        reservations:
          memory: 128m

  account-mart-api:
    <<: *api-service
    image: "${ACCOUNT_MART_API_IMAGE:?set immutable ACCOUNT_MART_API_IMAGE digest}"
    environment:
      <<: *common-environment
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "${ACCOUNT_MART_DB_URL:?set ACCOUNT_MART_DB_URL}"
      SPRING_DATASOURCE_USERNAME: "${ACCOUNT_MART_DB_USER:?set ACCOUNT_MART_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${ACCOUNT_MART_DB_PASSWORD:?set ACCOUNT_MART_DB_PASSWORD}"

