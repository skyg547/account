# [초보자를 위한 개념 설명]
# docker-compose.yml은 복잡한 docker run 명령을 실행 순서와 환경값으로 정리한 파일입니다.
# 이 파일은 이미 account-network에 Config/Discovery/Auth가 떠 있는 개발 환경에서 Gateway만 추가할 때 사용합니다.

services:
  gateway:
    # Gateway는 루트 Gradle 멀티모듈 설정이 필요하므로 빌드 컨텍스트를 저장소 루트로 잡습니다.
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      # 컨테이너 안의 localhost는 Gateway 자신이므로 Auth 서비스 이름을 사용합니다.
      - AUTH_TOKEN_VERSION_VALIDATION_BASE_URL=http://auth:8084
    networks:
      - account-network

networks:
  account-network:
    external: true
