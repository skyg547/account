# [초보자를 위한 개념 설명]
# docker-compose.yml은 복잡한 docker run 명령을 실행 순서와 환경값으로 정리한 파일입니다.
# 이 파일은 이미 account-network에 Config/Discovery/Auth가 떠 있는 개발 환경에서 Gateway만 추가할 때 사용합니다.

services:
  gateway:
    # Gateway는 루트 Gradle 멀티모듈 설정이 필요하므로 빌드 컨텍스트를 저장소 루트로 잡습니다.
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      # config-repo의 gateway-service.yml은 spring.cloud.config.override-system-properties(기본 true)
      # 때문에 EUREKA_CLIENT_SERVICEURL_DEFAULTZONE 환경변수를 무시하고 자체 값을 우선 적용합니다.
      # gateway-service.yml이 ${EUREKA_DEFAULT_ZONE:...} 형태로 이 이름을 참조하므로 반드시 이 변수명을 써야 합니다.
      - EUREKA_DEFAULT_ZONE=http://discovery:8761/eureka/
      # 서비스 디스커버리(Eureka) 및 Spring Cloud LoadBalancer 연동을 위한 로드밸런싱 주소
      - AUTH_TOKEN_VERSION_VALIDATION_BASE_URL=lb://auth-service
      # 현재 shell 또는 secret provider에서 Auth와 동일한 신규 승인 값을 주입합니다. 미설정 시 Compose가 실행을 중단합니다.
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
      # Frontend BFF와 Gateway만 공유하는 별도 키입니다. JWT/internal API 키를 재사용하지 않습니다.
      - BFF_GATEWAY_SHARED_SECRET=${BFF_GATEWAY_SHARED_SECRET:?set BFF_GATEWAY_SHARED_SECRET}
    networks:
      - account-network

networks:
  account-network:
    external: true
