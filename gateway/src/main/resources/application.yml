server:
  port: 8081

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${GATEWAY_ALLOWED_ORIGIN_PATTERN_1:http://localhost:*}
              - ${GATEWAY_ALLOWED_ORIGIN_PATTERN_2:http://127.0.0.1:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - X-Request-Id
            allowCredentials: true
      routes:
        - id: account-api
          uri: lb://account
          predicates:
            - Path=/api/**
        - id: account-actuator
          uri: lb://account
          predicates:
            - Path=/actuator/health,/actuator/info

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ho.account.gateway: INFO
