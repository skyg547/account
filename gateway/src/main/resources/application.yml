server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  cloud:
    gateway:
      # 명시적으로 허용한 lb:// route만 노출하고 /{serviceId}/** 자동 route는 생성하지 않습니다.
      # 라우팅에서 Eureka는 명시 route의 대상 인스턴스 선택에 사용하며,
      # Gateway 자체 Eureka 등록과 registry fetch 동작에는 영향을 주지 않습니다.
      discovery:
        locator:
          enabled: false
      # 글로벌 CORS 정책: 허용 오리진 패턴, HTTP 메서드, 헤더 및 클라이언트 브라우저 캐싱(maxAge) 설정
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - https://*.myaccount.com
              - https://*.trycloudflare.com
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - X-Request-Id
              - X-Auth-Error
              - Authorization
            allowCredentials: true
            maxAge: 3600
      # 전역 RequestRateLimiter 및 IP/KeyResolver 기반 API 호출 제한 정책 (DDoS 차단 및 백엔드 서버 보호)
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            rate-limiter: "#{@inMemoryRateLimiter}"

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:${JWT_SECRET:}}
    public-key: ${AUTH_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}
    jwks-uri: ${AUTH_JWT_JWKS_URI:${JWT_JWKS_URI:}}
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    allowed-clock-skew-seconds: ${AUTH_JWT_ALLOWED_CLOCK_SKEW_SECONDS:30}
  token-version-validation:
    enabled: ${AUTH_TOKEN_VERSION_VALIDATION_ENABLED:true}
    base-url: ${AUTH_TOKEN_VERSION_VALIDATION_BASE_URL:lb://auth-service}
    cache-ttl-seconds: ${AUTH_TOKEN_VERSION_VALIDATION_CACHE_TTL_SECONDS:30}
    timeout-millis: ${AUTH_TOKEN_VERSION_VALIDATION_TIMEOUT_MILLIS:500}
    maximum-cache-size: ${AUTH_TOKEN_VERSION_VALIDATION_MAXIMUM_CACHE_SIZE:10000}
