plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'account-gateway'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    // 이 의존성이 없으면 spring.config.import의 configserver: 스킴을 해석할 수 없고,
    // optional: 접두사가 그 실패를 조용히 삼켜 config-repo/gateway-service.yml이
    // 통째로 무시됩니다. 라우트와 Eureka defaultZone이 전부 그 파일에 있습니다.
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    
    // 연쇄 장애 방지를 위한 서킷 브레이커(두꺼비집) 추가
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // ELK Logstash 연동을 위한 인코더
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    // MSA 분산 추적(Zipkin)을 위한 Micrometer Tracing (Brave 브릿지 사용)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    // 추출한 운송장 번호 내역을 Zipkin 서버로 보내주는 역할
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    // 프로메테우스 메트릭 노출
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 통합 API 명세서 (Swagger) - Gateway 전용 (WebFlux)
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'

    // JWT (JSON Web Token) 검증을 위한 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

springBoot {
    mainClass = 'com.ho.account.gateway.GatewayApplication'
}
