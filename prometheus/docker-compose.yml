name: account-prometheus-dev

services:
  prometheus-dev:
    image: docker.io/prom/prometheus:v3.14.0
    container_name: account-prometheus-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_DEV_PORT:-19090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 4 -t 1 -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 128
    networks: [account-network]

volumes:
  prometheus_dev_data:

networks:
  account-network:
    external: true
