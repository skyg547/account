plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'account-asset-lease-core'
group = "${rootProject.group}.asset"

base {
    archivesName = 'account-asset-lease-core'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    api project(':contracts')
    implementation project(':shared-kernel')

    // [교육적 주석] core 모듈 내부의 infrastructure.persistence 패키지 어댑터 및 JPA Repository가
    // Spring Data JPA를 사용하므로 implementation 의존성을 포함합니다.
    // 도메인 및 서비스 계층은 JpaRepository에 직접 결합되지 않고 아웃바운드 포트(Outbound Port) 인터페이스를 이용합니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.kafka:spring-kafka'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

jar {
    enabled = true
}

