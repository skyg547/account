# ======================== Zipkin Infrastructure Compose =========================
# 초보자를 위한 개념 설명:
# Zipkin은 MSA 분산 트랜잭션 트레이싱(Distributed Tracing) 수집기입니다.

version: '3.8'

services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - account-network

networks:
  account-network:
    external: true