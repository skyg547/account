spring:
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST}:${DEV_DB_PORT:5432}/${DEV_DB_NAME}
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:true}
    discovery:
      enabled: ${SPRING_CLOUD_DISCOVERY_ENABLED:true}

eureka:
  client:
    enabled: ${INTERNAL_AUDIT_EUREKA_ENABLED:true}
    register-with-eureka: ${INTERNAL_AUDIT_EUREKA_ENABLED:true}
    fetch-registry: ${INTERNAL_AUDIT_EUREKA_ENABLED:true}
