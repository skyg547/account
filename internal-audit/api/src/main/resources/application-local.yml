# ==============================================================================
# Internal Audit API Module - Local Active Profile Configuration
# ==============================================================================
# [Architecture & Pedagogical Explanation / 교육적 주석]
# 1. Profile-Based Runtime Isolation (프로파일 기반 격리 런타임 환경)
#    - 'local' 프로파일은 로컬 개발자의 독립적인 환경 및 외부 통신이 차단된 오프라인 환경에서도
#      애플리케이션을 외부 연동 의존성(PostgreSQL, Config Server, Eureka, Vault 등) 없이 단독으로 구동할 수 있도록 보장합니다.
#    - 외부 런타임 환경 변수 주석이나 외부 서버 미작동으로 인한 개발 생산성 저하를 방지합니다.
#
# 2. H2 In-Memory Database with Flyway Migration (Flyway V60 마이그레이션 기반 인메모리 DB)
#    - 외부 PostgreSQL 설치 없이 빠르게 독립 구동할 수 있도록 H2 인메모리 데이터베이스를 사용합니다.
#    - 'MODE=PostgreSQL' 옵션을 추가하여 PostgreSQL 방언(Dialect) 및 데이터 타입 호환성을 확보합니다.
#    - 'spring.flyway.enabled=true' 및 'spring.flyway.target=60'을 지정하여 V60 마이그레이션 스크립트를
#      명시적으로 실행하여 DB 스키마 형상을 정확하게 구축합니다.
#    - 'spring.jpa.hibernate.ddl-auto=validate'를 설정하여 Flyway로 생성된 스키마와 JPA 엔티티 매핑 간
#      정합성을 엄격히 다단계로 검증합니다.
#
# 3. Control Plane Decoupling (런타임 제어 평면 비활성화)
#    - Spring Cloud Config Server, Eureka Discovery, Vault, Tracing(Zipkin 등)을 완전 비활성화합니다.
#    - 오프라인 단독 구동(Self-contained Local Runtime) 시 외부 제어 평면 서버 부재로 인한
#      네트워크 커넥션 타임아웃, 예외 발생 및 구동 실패 현상을 원천 차단합니다.
# ==============================================================================

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:internal_audit_local_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    target: "61"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: never
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false
