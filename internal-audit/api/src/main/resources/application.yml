spring:
  application:
    name: internal-audit-service
  profiles:
    default: local
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
    discovery:
      enabled: ${SPRING_CLOUD_DISCOVERY_ENABLED:false}
    vault:
      enabled: false
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8083}

internal-audit:
  identity:
    jwt-secret: ${AUTH_JWT_SECRET:}
    jwt-issuer: ${AUTH_JWT_ISSUER:auth-service}
    auth-base-url: ${INTERNAL_AUDIT_AUTH_BASE_URL:}
    permission-grants: ${INTERNAL_AUDIT_PERMISSION_GRANTS:}

eureka:
  client:
    enabled: ${INTERNAL_AUDIT_EUREKA_ENABLED:false}
    register-with-eureka: ${INTERNAL_AUDIT_EUREKA_ENABLED:false}
    fetch-registry: ${INTERNAL_AUDIT_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    vault:
      enabled: false
  tracing:
    enabled: false
