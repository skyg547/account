plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'account-internal-audit-api'
group = "${rootProject.group}.internalaudit"

base {
    archivesName = 'account-internal-audit-api'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation project(':internal-audit:core')
    implementation project(':shared-kernel')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootRun {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}

springBoot {
    mainClass = 'com.ho.account.internalaudit.api.InternalAuditApiApplication'
}

// The PostgreSQL suite must opt in to an isolated, disposable database.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'postgresql'
    }
}

tasks.register('postgresTest', Test) {
    description = 'Runs command idempotency and concurrency tests against isolated PostgreSQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgresql'
    }
    systemProperty 'internalAudit.test.postgresql.url',
            System.getProperty('internalAudit.test.postgresql.url', '')
    // A dedicated ephemeral database must be exercised on every invocation.
    outputs.upToDateWhen { false }
}
