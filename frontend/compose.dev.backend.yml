# ==============================================================================
# [프론트엔드 단독 개발 Compose — 백엔드 컨테이너 연동 overlay]
# ------------------------------------------------------------------------------
# compose.dev.yml 위에 얹어서, 루트 Compose로 띄운 백엔드 컨테이너와 같은 네트워크에
# 프론트엔드를 붙입니다.
#
#   docker compose -f compose.dev.yml -f compose.dev.backend.yml up -d --build
#
# 왜 이 파일이 필요한가:
#   루트 docker-compose.yml은 Gateway를 "127.0.0.1:8000:8000"으로 publish합니다.
#   loopback에만 바인딩되므로, 다른 컨테이너가 host.docker.internal(호스트 게이트웨이 IP)로
#   접근하면 연결이 거부됩니다. 따라서 백엔드가 "컨테이너"로 떠 있을 때는 호스트 포트를
#   경유하지 말고 같은 bridge 네트워크에 합류해 서비스 이름으로 직접 부르는 것이 맞습니다.
#
#   반대로 Gateway를 호스트에서 gradlew bootRun으로 띄웠다면 0.0.0.0에 바인딩되므로
#   이 overlay 없이 compose.dev.yml 기본값(host.docker.internal)이 그대로 동작합니다.
#
# 선행 조건:
#   루트 Compose가 먼저 떠 있어야 account-dev-network가 존재합니다.
#   Gateway와 Auth API가 함께 필요하므로 platform이 아니라 apis(또는 foundation)를 켭니다.
#
#     docker compose --env-file .env.dev `
#       -f docker-compose.yml -f compose.self-contained.yml `
#       --profile self-contained --profile apis up -d
#
#   (루트 Compose는 frontend 서비스도 함께 띄웁니다. 그쪽 frontend가 필요 없다면
#    이 overlay 대신 루트 Compose의 frontend를 그대로 쓰는 편이 더 단순합니다.)
# ==============================================================================

services:
  frontend-dev:
    environment:
      # 같은 네트워크 안이므로 서비스 이름으로 직접 호출합니다.
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://gateway:8000}
    networks:
      - default
      - account-network

networks:
  account-network:
    external: true
    name: ${ACCOUNT_NETWORK_NAME:-account-dev-network}
