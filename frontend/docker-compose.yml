version: '3.8'

services:
  # 우리 프론트엔드 서비스의 이름입니다.
  account-frontend:
    build:
      context: .
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    # 브라우저에서 'http://localhost:4000' 이라고 치면 
    # 컨테이너 안의 3000번 포트로 연결해줍니다.
    ports:
      - "4000:3000"
    # standalone production image를 그대로 실행합니다. 개발용 bind mount는 별도 Compose에서 정의합니다.
    environment:
      - NODE_ENV=production
    networks:
      - account-network

networks:
  account-network:
    external: true
