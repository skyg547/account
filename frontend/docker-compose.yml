version: '3.8'

services:
  # 우리 프론트엔드 서비스의 이름입니다.
  account-frontend:
    build: .
    # 브라우저에서 'http://localhost:4000' 이라고 치면 
    # 컨테이너 안의 3000번 포트로 연결해줍니다.
    ports:
      - "4000:3000"
    # 소스 코드가 바뀌면 바로 반영되도록 설정 (개발용)
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    # 다크 모드 등 필요한 환경 변수가 있다면 여기에 적어줍니다.
    environment:
      - NODE_ENV=development
    networks:
      - account-network

networks:
  account-network:
    external: true
