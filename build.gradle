plugins {
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

group = 'com.ho'
version = '0.0.1-SNAPSHOT'

ext {
    springCloudVersion = '2023.0.1'
    querydslVersion = '5.0.0'
}

subprojects {
    apply plugin: 'java'

    group = "${rootProject.group}.${project.parent ? project.parent.name : project.name}"
    version = rootProject.version

    base {
        archivesName = "${project.parent ? project.parent.name + '-' : ''}${project.name}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }
}

def productionJdbcRuntimeProjects = [
        ':asset-lease:api', ':asset-lease:batch',
        ':budget:api', ':budget:batch',
        ':closing:api', ':closing:batch',
        ':deposit:api', ':deposit:batch',
        ':expenditure-resolution:api', ':expenditure-resolution:batch',
        ':internal-audit:api',
        ':journal-ledger:api', ':journal-ledger:batch',
        ':loan:api', ':loan:batch',
        ':payable:api', ':payable:batch',
        ':receivable:api', ':receivable:batch',
        ':reconciliation:api', ':reconciliation:batch',
        ':reporting:api', ':reporting:batch',
        ':tax:api', ':tax:batch'
]

def productionHealthApiProjects = [
        ':asset-lease:api',
        ':budget:api',
        ':closing:api',
        ':deposit:api',
        ':expenditure-resolution:api',
        ':internal-audit:api',
        ':journal-ledger:api',
        ':loan:api',
        ':payable:api',
        ':receivable:api',
        ':reconciliation:api',
        ':reporting:api',
        ':tax:api'
]

tasks.register('verifyProductionRuntimeDependencies') {
    group = 'verification'
    description = 'Fails when runtimeClasspath or a bootJar lacks PostgreSQL/Actuator.'
    notCompatibleWithConfigurationCache(
            'This cross-project gate resolves runtime classpaths and inspects bootJar archives at execution time.')
    dependsOn productionJdbcRuntimeProjects.collect { "${it}:bootJar" }

    doLast {
        productionJdbcRuntimeProjects.each { projectPath ->
            def runtimeProject = project(projectPath)
            def modules = runtimeProject
                    .configurations
                    .runtimeClasspath
                    .resolvedConfiguration
                    .resolvedArtifacts
                    .collect { "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}".toString() }
                    .toSet()
            if (!modules.contains('org.postgresql:postgresql')) {
                throw new GradleException("${projectPath} runtimeClasspath is missing org.postgresql:postgresql")
            }
            def bootJar = runtimeProject.tasks.named('bootJar').get().archiveFile.get().asFile
            def postgresqlEntries = zipTree(bootJar).matching {
                include 'BOOT-INF/lib/postgresql-*.jar'
            }.files
            if (postgresqlEntries.isEmpty()) {
                throw new GradleException("${projectPath} bootJar is missing the PostgreSQL JDBC driver")
            }
        }

        productionHealthApiProjects.each { projectPath ->
            def runtimeProject = project(projectPath)
            def modules = runtimeProject
                    .configurations
                    .runtimeClasspath
                    .resolvedConfiguration
                    .resolvedArtifacts
                    .collect { "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}".toString() }
                    .toSet()
            if (!modules.contains('org.springframework.boot:spring-boot-starter-actuator')) {
                throw new GradleException("${projectPath} runtimeClasspath is missing spring-boot-starter-actuator")
            }
            def bootJar = runtimeProject.tasks.named('bootJar').get().archiveFile.get().asFile
            def actuatorEntries = zipTree(bootJar).matching {
                include 'BOOT-INF/lib/spring-boot-actuator-*.jar'
            }.files
            if (actuatorEntries.isEmpty()) {
                throw new GradleException("${projectPath} bootJar is missing Spring Boot Actuator")
            }
        }
    }
}
