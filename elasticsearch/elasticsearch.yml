# ======================== Elasticsearch Configuration =========================
# 초보자를 위한 엘라스틱서치 설정 파일입니다.
# ---------------------------------- Cluster -----------------------------------
# 이 데이터베이스 무리의 이름을 지정합니다. (도서관 이름)
cluster.name: account-logs-cluster

# ------------------------------------ Node ------------------------------------
# 현재 실행되는 이 서버(노드)의 이름을 지정합니다. (사서 이름)
node.name: account-es-node-1

# ---------------------------------- Network -----------------------------------
# 어떤 IP에서 접속을 허용할 것인가? (0.0.0.0은 모든 곳에서 접속 가능함을 의미)
network.host: 0.0.0.0

# --------------------------------- Discovery ----------------------------------
# 로컬 개발 환경이므로, 여러 노드를 묶는 대신 단일 노드로 실행되게 합니다.
discovery.type: single-node

# ---------------------------------- Security ----------------------------------
# X-Pack 보안 기능(비밀번호 등)은 로컬 테스트 편의성을 위해 일단 끕니다.
xpack.security.enabled: false
