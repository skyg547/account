# ======================== Elasticsearch Infrastructure Compose =========================
# 초보자를 위한 개념 설명:
# Elasticsearch는 분산 검색 및 로그(Log) 인덱싱 저장소입니다.

version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536m
        reservations:
          memory: 512m
    networks:
      - account-network

volumes:
  es-data:

networks:
  account-network:
    external: true