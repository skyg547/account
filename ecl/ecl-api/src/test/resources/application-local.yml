spring:
  datasource:
    url: jdbc:h2:mem:ecl-api-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/ecl-local-migration
    baseline-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: never
  cloud:
    vault:
      enabled: false
    discovery:
      enabled: false
    config:
      enabled: false
  kafka:
    listener:
      auto-startup: false
  redisson:
    enabled: false

eureka:
  client:
    enabled: false

management:
  health:
    vault:
      enabled: false
  tracing:
    enabled: false
