version: "3.8"

# Production 환경을 위한 docker-compose Overlay 파일
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # 인프라스트럭처 (Redis, PostgreSQL, Vault, Elastic)는 상용에서는 Managed Service(RDS, ElastiCache 등)를 사용할 것이므로 
  # 이 환경에서는 제거하거나 스케일-다운 (주석 처리)하여 충돌을 막음
  postgres:
    profiles: ["none"]
  redis:
    profiles: ["none"]
  vault:
    profiles: ["none"]
  elasticsearch:
    profiles: ["none"]
  logstash:
    profiles: ["none"]

  # 주요 API 및 Batch 서비스들은 포트 바인딩 없이 Gateway 혹은 Ingress를 통해서만 노출
  # 개발 시 볼륨 마운트 되어 있던 소스 마운트 제거 및 Restart Always 설정
  gateway:
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}

  auth-api:
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${PROD_DB_URL}
      - DB_USERNAME=${PROD_DB_USERNAME}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}

  # 다른 API 들도 동일하게 적용 (생략됨: CI 파이프라인에서 주입 권장)
