map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # 보안 헤더 추가
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 프록시 기본 설정
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 타임아웃 및 버퍼
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Docker/Podman 내부 DNS Resolver (환경변수 또는 런타임 resolv.conf 자동 주입)
    # 런타임 동적 DNS 해석을 활성화하여 기동 시 미실행 서비스로 인한 부팅 실패 방지
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 5s;

    # 1. Next.js 정적 리소스 캐싱
    location /_next/static/ {
        set $frontend_upstream "http://account-frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        error_page 502 = @minimal_static;
    }

    location @minimal_static {
        set $minimal_static_upstream "http://minimal-frontend:3000";
        proxy_pass $minimal_static_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 2. Spring Cloud Gateway 통합 API (/api/)
    location /api/ {
        set $gateway_upstream "http://account-gateway:8000";
        proxy_pass $gateway_upstream;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 = @minimal_gateway;
    }

    location @minimal_gateway {
        set $minimal_gateway_upstream "http://minimal-gateway:8000";
        proxy_pass $minimal_gateway_upstream;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Grafana 서버 메트릭 대시보드 (/grafana/)
    location /grafana/ {
        set $grafana_upstream "http://account-grafana:3000";
        proxy_pass $grafana_upstream;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        error_page 502 = @fallback_grafana;
    }

    location @fallback_grafana {
        set $fallback_grafana_upstream "http://grafana:3000";
        proxy_pass $fallback_grafana_upstream;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 4. Zipkin 분산 트레이싱 추적 UI (/zipkin/)
    location /zipkin/ {
        set $zipkin_upstream "http://account-zipkin:9411";
        proxy_pass $zipkin_upstream;
        proxy_set_header X-Forwarded-Prefix /zipkin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 = @fallback_zipkin;
    }

    location @fallback_zipkin {
        set $fallback_zipkin_upstream "http://zipkin:9411";
        proxy_pass $fallback_zipkin_upstream;
        proxy_set_header X-Forwarded-Prefix /zipkin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Kibana 통합 로그 분석 콘솔 (/kibana/)
    location /kibana/ {
        set $kibana_upstream "http://account-kibana:5601";
        proxy_pass $kibana_upstream;
        proxy_set_header X-Forwarded-Prefix /kibana;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        error_page 502 = @fallback_kibana;
    }

    location @fallback_kibana {
        set $fallback_kibana_upstream "http://kibana:5601";
        proxy_pass $fallback_kibana_upstream;
        proxy_set_header X-Forwarded-Prefix /kibana;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 6. pgAdmin 데이터베이스 관리자 콘솔 (/pgadmin/)
    location /pgadmin/ {
        set $pgadmin_upstream "http://account-pgadmin:80";
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_pass $pgadmin_upstream;
        proxy_set_header X-Forwarded-Prefix /pgadmin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
        error_page 502 = @fallback_pgadmin;
    }

    location @fallback_pgadmin {
        set $fallback_pgadmin_upstream "http://pgadmin:80";
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_pass $fallback_pgadmin_upstream;
        proxy_set_header X-Forwarded-Prefix /pgadmin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
    }

    location = /portainer {
        # A relative redirect retains the browser's published port (e.g. 8080).
        absolute_redirect off;
        return 301 /portainer/;
    }

    # Portainer's --base-url adjusts assets; its API still expects the prefix stripped.
    location /portainer/ {
        set $portainer_upstream "http://account-portainer:9000";
        rewrite ^/portainer/(.*)$ /$1 break;
        proxy_pass $portainer_upstream;
        proxy_http_version 1.1;
        # Preserve the browser authority including its port for CSRF origin checks.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /portainer;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Both access and upstream error logs can include WebSocket query tokens.
        access_log off;
        error_log /dev/null;
    }

    # 7. Next.js 웹 프론트엔드 (Root /)
    location / {
        set $frontend_upstream "http://account-frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        error_page 502 = @minimal_frontend;
    }

    location @minimal_frontend {
        set $minimal_frontend_upstream "http://minimal-frontend:3000";
        proxy_pass $minimal_frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
