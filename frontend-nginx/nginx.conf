map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # 보안 헤더 추가
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 프록시 기본 설정
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 타임아웃 및 버퍼
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 1. Next.js 정적 리소스 캐싱
    location /_next/static/ {
        proxy_pass http://account-frontend:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 2. Spring Cloud Gateway 통합 API (/api/)
    location /api/ {
        proxy_pass http://account-gateway:8000;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Grafana 서버 메트릭 대시보드 (/grafana/)
    location /grafana/ {
        proxy_pass http://account-grafana:3000;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 4. Zipkin 분산 트레이싱 추적 UI (/zipkin/)
    location /zipkin/ {
        proxy_pass http://account-zipkin:9411/zipkin/;
        proxy_set_header X-Forwarded-Prefix /zipkin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Kibana 통합 로그 분석 콘솔 (/kibana/)
    location /kibana/ {
        proxy_pass http://account-kibana:5601;
        proxy_set_header X-Forwarded-Prefix /kibana;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 6. pgAdmin 데이터베이스 관리자 콘솔 (/pgadmin/)
    location /pgadmin/ {
        proxy_pass http://account-pgadmin:80/;
        proxy_set_header X-Forwarded-Prefix /pgadmin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
    }

    # 7. Next.js 웹 프론트엔드 (Root /)
    location / {
        proxy_pass http://account-frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
