# ==============================================================================
# Nginx Single Entry Point & Reverse Proxy Configuration
# ==============================================================================
# [Architecture & Routing Matrix]
# 1. Single Entry Point (단일 진입점):
#    - 모든 외부 트래픽(포트 80)을 단일 진입점으로 수신하여 백엔드/모니터링 포트 직접 노출(Zero Direct Port Exposure)을 방지합니다.
#
# 2. Sub-path Routing Table:
#    - /              -> Next.js Web Frontend (frontend:3000)
#    - /_next/static/ -> Next.js Static Asset Caching
#    - /api/          -> Spring Cloud Gateway API Gateway (gateway:8000)
#    - /grafana/      -> Grafana Metrics Dashboard (grafana:3000)
#    - /zipkin/       -> Zipkin Distributed Tracing (zipkin:9411/zipkin/)
#    - /kibana/       -> Kibana Log Analysis Dashboard (kibana:5601)
#    - /pgadmin/      -> pgAdmin PostgreSQL Web GUI (pgadmin:80)
#
# 3. Security & WebSocket Hardening:
#    - HSTS / Frame-Options / XSS-Protection / Content-Type-Options 보안 헤더 탑재
#    - Next.js / Grafana Live 대시보드를 위한 WebSocket Upgrade 지원
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # 1. Security Headers (보안 강화 헤더)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # --------------------------------------------------------------------------
    # 2. Next.js Static Assets (정적 자원 캐싱)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. Spring Cloud Gateway API (/api/ -> gateway:8000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # 4. Grafana Server Metrics Dashboard (/grafana/ -> grafana:3000)
    # --------------------------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Grafana Live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --------------------------------------------------------------------------
    # 5. Zipkin Distributed Tracing UI (/zipkin/ -> zipkin:9411/zipkin/)
    # --------------------------------------------------------------------------
    location /zipkin/ {
        proxy_pass http://zipkin:9411/zipkin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 6. Kibana Unified Log Search (/kibana/ -> kibana:5601)
    # --------------------------------------------------------------------------
    location /kibana/ {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kibana;
    }

    # --------------------------------------------------------------------------
    # 7. pgAdmin Database Management (/pgadmin/ -> pgadmin:80)
    # --------------------------------------------------------------------------
    location /pgadmin/ {
        proxy_pass http://pgadmin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 8. Next.js Web Frontend (Default Root / -> frontend:3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}