# ======================== Kibana Infrastructure Compose =========================
# 초보자를 위한 개념 설명:
# Kibana는 Elasticsearch에 쌓인 로그를 웹 화면에서 검색하고 시각화해 주는 도구입니다.

version: '3.8'

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"\\|\"level\":\"warn\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024m
        reservations:
          memory: 256m
    networks:
      account-network:
        aliases:
          - kibana
          - account-kibana

networks:
  account-network:
    external: true