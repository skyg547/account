# ======================== Kibana Configuration =========================
# 초보자를 위한 키바나 설정 파일입니다.

# 키바나 웹 서버의 이름입니다.
server.name: kibana

# 키바나 웹 서버가 열어둘 주소 (모든 곳에서 접속 가능)
server.host: "0.0.0.0"

# (가장 중요!) 데이터를 가져올 Elasticsearch의 주소입니다.
# 도커 네트워크 안에서는 컨테이너 이름인 'elasticsearch'로 통신합니다.
elasticsearch.hosts: [ "http://elasticsearch:9200" ]

# 보안 모니터링 기능 끄기 (로컬 메모리 절약)
monitoring.ui.container.elasticsearch.enabled: false
