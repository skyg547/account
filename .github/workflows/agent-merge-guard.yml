name: Agent Merge Guard

# Read-only metadata guard. No pull_request_target, secrets, write token, or
# execution of PR code in the metadata job. See delegation policy section 7.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

# Both event families share a group. An older event can cancel a newer run;
# the adapter rejects stale head/base instead of certifying the wrong commit.
concurrency:
  group: agent-merge-guard-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test merge guard candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require main target before executing repository code
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$PR_BASE_REF" != "main" ]; then
            echo "::error::Unverified target branch."
            exit 1
          fi
      - name: Checkout candidate for isolated tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run offline guard regression tests
        run: node --test tools/ci/agent-merge-guard.test.cjs

  guard:
    needs: [tests]
    name: Check implementer PR discipline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main target before executing repository code
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$PR_BASE_REF" != "main" ]; then
            echo "::error::Unverified target branch."
            exit 1
          fi
      - name: Checkout trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Test trusted base guard
        run: node --test tools/ci/agent-merge-guard.test.cjs
      - name: Evaluate current PR metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { runGuard } = require('./tools/ci/agent-merge-guard.cjs');
            const pr = context.payload.pull_request;
            const result = await runGuard({
              github,
              identity: { repository: `${context.repo.owner}/${context.repo.repo}`, number: pr.number },
              expectedHead: pr.head.sha,
              expectedBase: pr.base.sha,
              // Deliberately unconfigured pending owner approval of the trust model.
              // Never accept policy or reviewer identities from PR-controlled metadata.
              policy: undefined,
            });
            core.info(`Agent Merge Guard: ${result.ok ? 'PASS' : 'FAIL'}`);
            core.info(`head=${result.head || 'unverified'} base=${result.base || 'unverified'}`);
            if (!result.ok) core.setFailed(result.problems.join(', '));
