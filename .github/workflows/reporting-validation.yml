name: Reporting Validation

on:
  pull_request:
    paths:
      - "reporting/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  push:
    branches:
      - "main"
    paths:
      - "reporting/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

jobs:
  reporting-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run Reporting Validation Tasks
        run: ./gradlew :reporting:core:test :reporting:api:test :reporting:batch:test --console=plain
