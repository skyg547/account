name: Module Validation

# 변경된 Gradle 모듈만 골라 테스트한다.
#
# 이전에는 reporting 모듈 하나만 CI 대상이었고 나머지 20여 개 모듈은 검사되지
# 않았다. 이 워크플로는 diff에서 변경된 최상위 디렉터리를 추출한 뒤,
# settings.gradle의 include 목록에서 해당 디렉터리에 속한 Gradle 프로젝트 경로를
# 찾아 matrix로 병렬 실행한다. 모듈이 추가되어도 settings.gradle만 갱신하면
# 이 파일은 수정할 필요가 없다.
#
# 초보자 설명:
#   "CI(지속적 통합)"는 코드를 올릴 때마다 자동으로 테스트를 돌려주는 로봇이다.
#   이 저장소에는 모듈이 60개가 넘는데 전부 테스트하면 매번 20분 넘게 걸린다.
#   그래서 "이번에 건드린 모듈만" 골라서 돌린다.
#
#   예: loan/ 안의 파일만 고쳤다 -> :loan:core:test, :loan:api:test,
#       :loan:batch:test 세 개만 실행하고 나머지 모듈은 건너뛴다.
#
#   단, shared-kernel처럼 "모든 모듈이 가져다 쓰는 공용 코드"를 고쳤다면
#   어디가 깨질지 알 수 없으므로 전체를 다시 돌린다.
#
#   이 파일은 3단계(job)로 나뉜다:
#     1) detect  - 무엇이 바뀌었는지 알아내서 테스트할 목록을 만든다
#     2) test    - 그 목록을 병렬로 실행한다
#     3) result  - 결과를 하나로 모아 통과/실패를 알린다

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.resolve.outputs.modules }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed Gradle projects
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # settings.gradle의 include 목록에서 Gradle 프로젝트 경로를 읽는다.
          # rootProject.name('account')만 제외하면 나머지는 전부 프로젝트 경로다.
          #
          # 초보자 설명: settings.gradle에는 이 저장소가 가진 모든 모듈이
          #   'loan:core', 'loan:api' 처럼 작은따옴표로 적혀 있다. 그 목록을
          #   그대로 읽어오므로, 나중에 모듈을 추가해도 이 파일은 고칠 필요가 없다.
          mapfile -t ALL_PROJECTS < <(
            grep -oE "'[a-z][a-z0-9:_-]*'" settings.gradle \
              | tr -d "'" \
              | grep -vx 'account' \
              | sort -u
          )
          echo "settings.gradle에서 ${#ALL_PROJECTS[@]}개 프로젝트를 읽었습니다."

          # 파싱이 실패하면 조용히 "변경 없음"으로 흘러가 전 모듈이 미검증 상태로
          # 통과한다. 결과가 비면 즉시 실패시켜 fail-closed로 만든다.
          #
          # 초보자 설명: settings.gradle 형식이 바뀌거나 파일을 못 찾으면 목록이
          #   빈 채로 진행될 수 있다. 그러면 "테스트할 게 없다"고 판단해 아무것도
          #   검사하지 않고 초록불이 뜬다. 그래서 목록이 비면 일부러 실패시킨다.
          if [ "${#ALL_PROJECTS[@]}" -eq 0 ]; then
            echo "::error::settings.gradle에서 Gradle 프로젝트를 하나도 읽지 못했습니다."
            echo "::error::파싱 로직 또는 settings.gradle 형식을 확인하십시오."
            exit 1
          fi

          run_everything() {
            printf '%s\n' "${ALL_PROJECTS[@]}" | awk -F: '{print $1}' | sort -u
          }

          # 변경 파일 목록을 결정한다. base를 특정할 수 없으면 안전하게 전체를 돈다.
          #
          # 초보자 설명: "무엇이 바뀌었나"를 알려면 비교 기준이 필요하다.
          #   PR이면 "합치려는 대상 브랜치"와 비교하고, main에 직접 push면
          #   "이전 커밋"과 비교한다. 기준을 못 찾으면 판단을 포기하고
          #   전체를 돌린다 — 빠뜨리는 것보다 느린 편이 안전하기 때문이다.
          CHANGED=""
          FULL_RUN_REASON=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FULL_RUN_REASON="workflow_dispatch로 수동 실행"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "${BEFORE_SHA:-}" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            FULL_RUN_REASON="비교 기준 커밋을 특정할 수 없음"
          fi

          if [ -z "$FULL_RUN_REASON" ]; then
            # 공용 자산이 바뀌면 어떤 모듈이든 영향을 받으므로 전체를 돈다.
            #
            # 초보자 설명: shared-kernel과 contracts는 모든 모듈이 가져다 쓰는
            #   공용 부품이다. 여기를 고치면 어느 모듈이 깨질지 알 수 없으므로
            #   선택 실행을 포기하고 전부 검사한다. 빌드 설정(build.gradle 등)도
            #   마찬가지다.
            if echo "$CHANGED" | grep -qE '^(settings\.gradle|build\.gradle|gradle\.properties|gradlew|gradlew\.bat|gradle/|shared-kernel/|contracts/|\.github/workflows/)'; then
              FULL_RUN_REASON="공용 빌드 설정 또는 shared-kernel/contracts 변경"
            fi
          fi

          if [ -n "$FULL_RUN_REASON" ]; then
            CHANGED_DIRS=$(run_everything)
            REASON="전체 모듈 실행 — $FULL_RUN_REASON"
          else
            CHANGED_DIRS=$(echo "$CHANGED" | awk -F/ 'NF>1 {print $1}' | sort -u)
            REASON="변경 감지 기반 선택 실행"
          fi

          # 변경된 디렉터리에 속한 Gradle 프로젝트 경로를 모아 matrix 항목을 만든다.
          # 디렉터리 이름과 Gradle 경로의 첫 세그먼트를 대조하므로
          # account-mart:mart-core, ecl:ecl-core 같은 변칙 명명도 그대로 처리된다.
          #
          # 초보자 설명: Gradle 경로는 'loan:core' 처럼 콜론(:)으로 나뉜다.
          #   맨 앞 조각이 폴더 이름과 같으면 그 폴더에 속한 모듈이다.
          #   이 규칙 덕분에 아래 세 가지가 자동으로 처리된다.
          #     loan/        -> :loan:core :loan:api :loan:batch
          #     account-mart/-> :account-mart:mart-core ... (이름이 mart-로 시작해도 OK)
          #     gateway/     -> :gateway            (하위 모듈이 없는 단독 모듈도 OK)
          #   docs/ 처럼 Gradle 모듈이 아닌 폴더는 대응되는 경로가 없어 자동 제외된다.
          ENTRIES=""
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            TASKS=$(
              printf '%s\n' "${ALL_PROJECTS[@]}" \
                | awk -F: -v d="$dir" '$1==d' \
                | sed 's|^|:|; s|$|:test|' \
                | tr '\n' ' '
            )
            TASKS=$(echo "$TASKS" | sed 's/[[:space:]]*$//')
            [ -n "$TASKS" ] || continue
            ENTRIES="${ENTRIES}${dir}\t${TASKS}\n"
          done <<< "$CHANGED_DIRS"

          if [ -z "$ENTRIES" ]; then
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            echo "reason=Gradle 모듈 변경 없음 — 테스트를 건너뜁니다." >> "$GITHUB_OUTPUT"
            echo "테스트할 Gradle 모듈이 없습니다."
            exit 0
          fi

          MATRIX=$(
            printf '%b' "$ENTRIES" \
              | jq -R -s -c 'split("\n")
                  | map(select(length > 0))
                  | map(split("\t") | {module: .[0], tasks: .[1]})'
          )

          echo "modules=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "$REASON"
          echo "$MATRIX" | jq -r '.[] | "  \(.module): \(.tasks)"'

  test:
    name: ${{ matrix.module }}
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 초보자 설명: fail-fast를 false로 두면 한 모듈이 실패해도 나머지 모듈
      #   테스트를 끝까지 돌린다. true(기본값)면 하나 깨지는 순간 전부 중단되어,
      #   "사실은 3개가 깨졌는데 1개만 보이는" 상황이 생긴다.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests for ${{ matrix.module }}
        run: ./gradlew ${{ matrix.tasks }} --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: "**/build/reports/tests/test/**"
          retention-days: 7

  # 브랜치 보호 규칙에서 단일 required check로 걸 수 있도록 matrix 결과를 모은다.
  # matrix job은 실행 대상이 매번 달라져 이름을 고정할 수 없기 때문이다.
  #
  # 초보자 설명: GitHub에서 "이 검사를 통과해야만 merge 허용"으로 지정하려면
  #   검사 이름이 항상 같아야 한다. 그런데 위 test job은 이번에 바뀐 모듈에 따라
  #   이름이 'loan'이 됐다가 'tax'가 됐다가 한다. 그래서 이름이 절대 안 바뀌는
  #   이 job을 하나 두고, 여기서 최종 통과/실패만 알린다.
  result:
    name: Module Validation Result
    needs: [detect, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          TEST_RESULT: ${{ needs.test.result }}
          REASON: ${{ needs.detect.outputs.reason }}
        run: |
          echo "detect=$DETECT_RESULT / test=$TEST_RESULT"
          echo "${REASON:-(사유 없음)}"

          # detect가 실패하면 test는 skipped가 된다. test 결과만 보면 두 조건에
          # 모두 걸리지 않아 통과로 처리되므로, detect를 먼저 검사해야 한다.
          #
          # 초보자 설명: 이 job은 "merge해도 되는가"를 결정하는 최종 관문이다.
          #   앞 단계가 고장 나서 테스트를 아예 못 돌렸는데 초록불을 주면,
          #   검증 없이 코드가 들어간다. 그래서 "성공"이 아닌 모든 경우를
          #   실패로 처리한다.
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect job이 성공하지 않았습니다 ($DETECT_RESULT). 테스트 대상을 결정하지 못했습니다."
            exit 1
          fi

          # test가 skipped인 경우는 정상이다 — Gradle 모듈이 바뀌지 않아
          # 돌릴 것이 없었다는 뜻이다. 그 외 비정상 종료는 전부 실패로 본다.
          case "$TEST_RESULT" in
            success|skipped)
              echo "통과했습니다."
              ;;
            *)
              echo "::error::모듈 테스트가 통과하지 못했습니다 ($TEST_RESULT)."
              exit 1
              ;;
          esac
