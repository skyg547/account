name: Agent Implementation Spec (설계·작업지시)
description: 상위 모델이 원인 분석·설계·작업 지시까지 작성해, 구현 담당 모델이 그대로 실행할 수 있는 Issue를 만든다.
title: "[SPEC][module] "
labels: ["agent-loop", "spec-driven", "status:draft"]
body:
  - type: markdown
    attributes:
      value: |
        ## 이 템플릿의 목적

        이 Issue는 **구현 담당 모델이 추가 판단 없이 그대로 실행할 수 있을 만큼** 상세해야 합니다.
        분석과 설계는 **상위 추론 모델(Spec Author)** 이 끝내고, 구현 모델은 지시를 실행합니다.

        - 작성 규칙과 티어 정의: `docs/ai-harness/87-spec-driven-delegation.md`
        - Issue 소유·claim 규약: `docs/ai-harness/86-multi-tool-issue-ownership.md`

        > **작성이 끝나기 전에는 `status:draft`를 유지하세요.** 아래 "Ready 체크리스트"가 전부
        > 채워진 뒤에 Integrator가 `status:ready`로 바꿉니다. `status:ready`가 아닌 Issue는
        > 구현 모델이 claim할 수 없습니다.

  - type: input
    id: spec_author
    attributes:
      label: Spec Author (작성 모델/도구)
      description: 이 설계를 작성한 상위 추론 모델. 예 - Claude Opus, Codex(high reasoning)
      placeholder: "Claude Opus 5"
    validations:
      required: true

  - type: dropdown
    id: implementer_tier
    attributes:
      label: 구현 담당 티어
      description: 70-model-assignment-policy.md의 capability 기준. 금융 계산·동시성·마이그레이션이 걸리면 Fast를 쓰지 않는다.
      options:
        - "Fast/Low-Cost (기계적 실행, 지시가 완전할 때만)"
        - "Balanced (경계가 분명한 구현)"
        - "High Reasoning (설계 판단이 남아 있음)"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 대상 모듈
      multiple: true
      options:
        - account-mart
        - asset-lease
        - auth
        - budget
        - closing
        - config-server
        - contracts
        - deposit
        - discovery
        - ecl
        - expenditure-resolution
        - frontend
        - gateway
        - internal-audit
        - journal-ledger
        - loan
        - master-data
        - migration-runner
        - payable
        - receivable
        - reconciliation
        - reporting
        - shared-kernel
        - tax
        - docs/harness
        - infra/compose
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 1. 문제 (Problem)
      description: 무엇이 잘못되었는지 한 문단으로. 추측이 아니라 관측된 사실만.
      placeholder: "컨테이너 빌드가 전부 실패한다. Containerfile과 Containerfile.dev가 모두 npm ci를 사용하는데 ..."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 2. 증거 (Evidence)
      description: 파일:라인, 재현 명령, 실제 출력. 여기서 재현되지 않으면 구현 모델도 검증할 수 없다.
      value: |
        재현 명령:
        ```bash

        ```

        실제 출력:
        ```

        ```

        관련 코드:
        - `경로/파일.java:123` —
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: 3. 근본 원인 (Root Cause)
      description: 증상이 아니라 원인. "왜 그렇게 되는가"를 코드/설정 근거와 함께.
      placeholder: "next@15.0.0의 peer 범위가 react@19.0.0 정식판을 포함하지 않는다. 로컬 node_modules가 --force로 설치되어 있어 깨끗한 환경에서만 드러난다."
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 4. 영향 (Impact)
      description: 회계 정합성, 보안, 데이터, 빌드, 재실행, 운영 중 무엇에 어떻게 영향을 주는가.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 5. 설계 / 목표 상태 (Design)
      description: 고친 뒤의 상태를 구조적으로 기술. 헥사고날 경계(domain/port/adapter)와 계약 변화를 명시.
      value: |
        목표 상태:
        -

        레이어/경계 영향:
        - domain:
        - application(port):
        - adapter/infrastructure:

        계약 변화 (API/이벤트/스키마):
        -
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 6. 검토한 대안과 기각 사유 (Alternatives)
      description: 구현 모델이 "더 쉬운 길"로 새지 않도록, 일부러 택하지 않은 길을 남긴다.
      value: |
        - 대안 A: … → 기각 사유:
        - 대안 B: … → 기각 사유:
    validations:
      required: true

  - type: textarea
    id: work_instructions
    attributes:
      label: 7. 작업 지시 (Work Instructions)
      description: 순서가 있는 단계로. 각 단계는 파일 단위로 무엇을 어떻게 바꾸는지 명시한다. 구현 모델은 이 목록을 벗어나지 않는다.
      value: |
        1. `경로/파일`:
           - 변경:
           - 이유:
        2. `경로/파일`:
           - 변경:
           - 이유:
        3. 테스트 추가/수정:
           - `경로/테스트파일`:
           - 검증 대상:
    validations:
      required: true

  - type: textarea
    id: allowlist
    attributes:
      label: 8. 변경 허용 파일 (Allowlist)
      description: 여기에 없는 파일은 건드리지 않는다. 병렬 작업 시 다른 Issue와 겹치면 안 된다.
      value: |
        허용:
        - `module/**`
        - `module/src/test/**`

        금지 (Integrator 전용):
        - `settings.gradle`, 루트 `build.gradle`
        - `docker-compose*.yml`, `compose.*.yml`
        - `docs/ai-harness/**` 공용 기록
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 9. 비목표 (Non-Goals)
      description: 이번에 하지 않을 것. 범위 확장을 막는 장치다.
      value: |
        - 이 Issue에서 하지 않는다:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 10. 수용 기준 (Acceptance Criteria)
      description: 객관적으로 판정 가능한 조건만. "잘 동작한다" 같은 표현은 금지.
      value: |
        - [ ] 지시된 파일만 변경되었다 (allowlist 준수)
        - [ ] 아래 검증 명령이 모두 통과한다
        - [ ] 회귀 테스트가 추가되어 원인을 실제로 잡는다
        - [ ] `git diff --check` 통과, conflict marker 없음
        - [ ] Draft PR 본문에 검증 출력이 포함되었다
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 11. 검증 명령 (Verification)
      description: 그대로 복사해 실행할 수 있어야 한다. 기대 결과도 함께.
      value: |
        ```bash
        ./gradlew :module:core:test --console=plain --no-daemon
        ```
        기대: BUILD SUCCESSFUL, 신규 테스트 N개 통과

        검증 불가 항목과 이유:
        -
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 12. 롤백 (Rollback)
      placeholder: "이 PR의 커밋을 revert한다. 스키마 변경이 없으므로 forward-only 제약 없음."
    validations:
      required: true

  - type: checkboxes
    id: merge_authority
    attributes:
      label: 13. 병합 권한 (Merge Authority)
      description: 구현 담당은 PR 생성까지만 한다. 검토·승인·병합은 상위 모델 또는 사람이 한다.
      options:
        - label: 구현 담당은 PR을 열기만 하고, `main` 병합을 시도하지 않는다.
          required: true
        - label: 구현 담당은 자신의 PR을 스스로 승인(approve)하지 않는다.
          required: true
        - label: 병합은 Reviewer 승인 후 Integrator(상위 모델 또는 사람)만 수행한다.
          required: true

  - type: checkboxes
    id: ready_checklist
    attributes:
      label: Ready 체크리스트 (Integrator 확인용)
      description: 전부 충족되어야 `status:draft` → `status:ready`로 전환한다.
      options:
        - label: 근본 원인이 증거와 함께 특정되었다 (증상 나열이 아님)
        - label: 작업 지시가 파일 단위로 순서화되어 있다
        - label: allowlist가 다른 진행 중 Issue와 겹치지 않는다
        - label: 검증 명령이 실행 가능하고 기대 결과가 적혀 있다
        - label: 구현 티어가 위험도에 맞게 선택되었다

  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: main/master/develop에 직접 push하지 않는다.
          required: true
        - label: 비밀정보, 자격증명, 토큰, 개인정보, 운영 URL을 읽거나 출력하지 않는다.
          required: true
        - label: conflict marker를 커밋하지 않는다.
          required: true
        - label: 승인 없이 패키지 설치나 외부 스크립트를 실행하지 않는다.
          required: true
