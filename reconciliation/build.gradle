plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'account-reconciliation'

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.5')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.1')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.2.5')
    testImplementation platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.1')

    implementation project(':shared-kernel')
    implementation project(':contracts')
    implementation project(':master-data')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
