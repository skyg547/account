plugins {
    id 'org.springframework.boot'
}

description = 'account-reconciliation-api'
group = "${rootProject.group}.reconciliation"

base {
    archivesName = 'account-reconciliation-api'
}

dependencies {
    // Use Core's native BOM model to avoid the observed Gradle 8.7 Archaius resolution failure.
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:3.2.5')
    implementation enforcedPlatform('org.springframework.cloud:spring-cloud-dependencies:2023.0.1')
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation project(':reconciliation:core')
    implementation project(':shared-kernel')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sourceSets.test.java.srcDir rootProject.file('test-support/runtime-contracts/src/test/java')

bootJar { enabled = true }
jar { enabled = false }

springBoot {
    mainClass = 'com.ho.account.reconciliation.api.ReconciliationApiApplication'
}

bootRun {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}
