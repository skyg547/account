plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

dependencies {
    implementation project(':risk:core')
    implementation project(':master-data') // BusinessPartner 참조용
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA 어노테이션 및 타입 참조용
}

bootJar {
    enabled = true
}
