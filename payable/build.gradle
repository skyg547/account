plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'account-payable-compat'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    api project(':payable:core')
}

tasks.named('compileJava') {
    dependsOn ':payable:core:compileJava'
}

tasks.named('test') {
    dependsOn ':payable:core:test'
}

tasks.named('check') {
    dependsOn ':payable:core:check'
}
