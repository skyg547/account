server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: payable-api
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/payable-migration
    clean-disabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
