plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'account-payable-batch'
group = "${rootProject.group}.payable"

base {
    archivesName = 'account-payable-batch'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation project(':payable:core')
    implementation project(':shared-kernel')

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootRun {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}

bootJar { enabled = true }
jar { enabled = false }

springBoot {
    mainClass = 'com.ho.account.expenditure.payable.batch.PayableBatchApplication'
}
