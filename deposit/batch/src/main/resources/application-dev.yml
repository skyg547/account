spring:
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST}:${DEV_DB_PORT:5432}/${DEV_DB_NAME}
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # Development and production schemas are owned by the release migration runner.
  flyway:
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never

account:
  deposit:
    local-adapters:
      # Override the standalone default: dev jobs must use the configured remote ports.
      enabled: false
