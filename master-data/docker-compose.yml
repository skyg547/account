# 이미 account-network에 Config Server와 Discovery가 떠 있는 개발 환경에서 Master Data만 추가하는 보조 Compose입니다.
services:
  master-data:
    # 루트 Gradle 멀티모듈 파일과 contracts/shared-kernel이 필요하므로 저장소 루트를 사용합니다.
    build:
      context: ..
      dockerfile: Containerfile
      args:
        GRADLE_PROJECT: ":master-data:api"
        JAR_DIRECTORY: master-data/api
    container_name: master-data
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      # config-repo의 master-data.yml은 spring.cloud.config.override-system-properties(기본 true) 때문에
      # EUREKA_CLIENT_SERVICEURL_DEFAULTZONE을 무시합니다. master-data.yml이 ${EUREKA_DEFAULT_ZONE:...}
      # 형태로 이 이름을 참조하므로 반드시 이 변수명을 써야 합니다.
      - EUREKA_DEFAULT_ZONE=http://discovery:8761/eureka/
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      # config-repo/master-data-docker.yml이 참조하는 placeholder입니다.
      # datasource/redis 자체를 SPRING_* 환경변수로 지정하면 override-system-properties
      # 때문에 Config Server 값에 덮이므로, 접속 대상만 이 이름으로 넘깁니다.
      - DEV_DB_HOST=${DEV_DB_HOST:-account-postgres}
      - DEV_DB_PORT=${DEV_DB_PORT:-5432}
      - DEV_DB_NAME=${DEV_DB_NAME:-account_db}
      - DEV_DB_USER=${DEV_DB_USER:?set DEV_DB_USER}
      - DEV_DB_PASSWORD=${DEV_DB_PASSWORD:?set DEV_DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-account-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Vault 서버가 없는 개발 환경에서는 비활성화하지 않으면 ClientAuthenticationFactory 생성 실패로
      # 기동 자체가 크래시합니다(auth/docker-compose.yml과 동일한 이유).
      - SPRING_CLOUD_VAULT_ENABLED=false
    networks:
      - account-network

networks:
  account-network:
    external: true
