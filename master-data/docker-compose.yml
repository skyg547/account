# 이미 account-network에 Config Server와 Discovery가 떠 있는 개발 환경에서 Master Data만 추가하는 보조 Compose입니다.
services:
  master-data:
    # 루트 Gradle 멀티모듈 파일과 contracts/shared-kernel이 필요하므로 저장소 루트를 사용합니다.
    build:
      context: ..
      dockerfile: master-data/Dockerfile
    container_name: master-data
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    networks:
      - account-network

networks:
  account-network:
    external: true