spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:master-data-api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    # V9 and later migrations use PostgreSQL-only SQL; the local screening schema is initialized below.
    target: "8.1"
    locations: classpath:db/migration,classpath:db/local-migration,classpath:db/migration-h2
  jpa:
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema-business-partner-screening.sql
      data-locations: classpath:data-local.sql

eureka:
  client:
    enabled: false
