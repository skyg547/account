server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: master-data
  config:
    import: "optional:configserver:http://localhost:8888/"

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
