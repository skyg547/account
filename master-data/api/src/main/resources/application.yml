server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: master-data
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE:account-api}

master-data:
  internal-auth:
    secret: ${MASTER_DATA_CLOSING_ASSERTION_SECRET:}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
