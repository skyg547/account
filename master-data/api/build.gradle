plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}
description = 'account-master-data-api'
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}
dependencies {
    implementation project(':master-data:core')
    implementation project(':contracts')
    implementation project(':shared-kernel')
    
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    // Read structured constraint metadata when classifying PostgreSQL conflicts at the HTTP boundary.
    compileOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
// api is the HTTP executable. Keeping the plain library jar disabled makes it
// difficult to deploy the wrong artifact by accident.
bootJar { enabled = true }
jar { enabled = false }

bootRun {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}

springBoot {
    mainClass = 'com.ho.account.masterdata.MasterDataApplication'
}
