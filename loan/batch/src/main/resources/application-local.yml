# ==============================================================================
# Loan Batch Module - Local Profile
# ==============================================================================
# 이 파일은 loan-batch를 외부 인프라 없이 단독 기동시키기 위한 설정이다.
#
# 초보자 설명:
#   "프로파일"은 실행 환경별 설정 묶음이다. local은 개발자 PC나 테스트에서
#   PostgreSQL, Config Server, Eureka 같은 외부 서버 없이 혼자 돌 수 있게 한다.
#   base application.yml이 이미 web-application-type/cloud/eureka 비활성을
#   담당하므로, 여기서는 DB와 배치 메타데이터만 추가로 정의한다.
#
# 배치 모듈에서 특히 중요한 두 가지:
#   1) job.enabled: false — 기동만 해도 Job이 자동 실행되면 로컬 DB가 오염되고
#      의도치 않은 업무 처리가 일어난다. 실행은 --spring.batch.job.name=... 같은
#      명시적 지시로만 이뤄져야 한다.
#   2) initialize-schema: always — Spring Batch는 실행 이력을 DB 테이블에
#      기록한다. 인메모리 H2는 매번 비어 있으므로 그 테이블을 자동 생성해야 한다.
# ==============================================================================

spring:
  config:
    activate:
      on-profile: local

  datasource:
    # DB_CLOSE_DELAY=-1 을 주지 않으면 마지막 커넥션이 닫힐 때 인메모리 DB가
    # 통째로 사라져, 같은 JVM 안에서도 스키마가 증발한다.
    url: jdbc:h2:mem:loan_batch_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  batch:
    job:
      # 기동 시 등록된 Job을 자동 실행하지 않는다.
      enabled: false
    jdbc:
      # BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION 등 메타데이터 테이블을 생성한다.
      initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # SQL을 콘솔에 찍고 싶으면 아래 주석 블록을 켠다. 기본은 끈 상태다 —
    # 켜두면 테스트 로그가 Hibernate DDL/SQL 덤프로 덮여 실패 원인을 찾기 어렵다.
    # show-sql: true
    # properties:
    #   hibernate:
    #     format_sql: true

  # 도메인 스키마는 위 ddl-auto가 만든다. Flyway와 SQL 초기화는 로컬에서 쓰지 않는다.
  flyway:
    enabled: false
  sql:
    init:
      mode: never
