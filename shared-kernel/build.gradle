plugins {
    id 'java-library'
}

description = 'account-shared-kernel'

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.2.5')
    api platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.1')
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    // ELK Logstash 연동을 위한 인코더
    api 'net.logstash.logback:logstash-logback-encoder:7.4'
    
    // 상태 체크 및 메트릭 노출용 Actuator
    api 'org.springframework.boot:spring-boot-starter-actuator'
    // 프로메테우스가 읽을 수 있는 형태로 메트릭을 변환해주는 레지스트리
    api 'io.micrometer:micrometer-registry-prometheus'

    // MSA 분산 추적(Zipkin)을 위한 Micrometer Tracing (Brave 브릿지 사용)
    api 'io.micrometer:micrometer-tracing-bridge-brave'
    // 추출한 운송장 번호 내역을 Zipkin 서버로 보내주는 역할
    api 'io.zipkin.reporter2:zipkin-reporter-brave'
    
    // MSA 중앙 설정 관리(Config Client)
    api 'org.springframework.cloud:spring-cloud-starter-config'
}
