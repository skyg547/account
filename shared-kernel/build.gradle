plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.4'
}

description = 'account-shared-kernel'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
    }
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // @todo shared-kernel을 인프라 starter/BOM처럼 사용하지 않는다. 실제 사용처를 조사해 JPA,
    // Kafka, Redis, Vault, 관측, Swagger 의존성을 각 adapter 또는 convention plugin으로 이동한다.
    // 현재는 다수 모듈이 전이 의존성에 기대고 있어 단계별 이동 전 일괄 삭제하면 안 된다.
    api 'jakarta.persistence:jakarta.persistence-api'
    api "com.querydsl:querydsl-jpa:5.1.0:jakarta"
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    // Keep the Jackson family aligned with the Spring Boot 3.2.5 BOM. Pinning only
    // databind to 2.17.x leaves core/annotations at 2.15.x and fails at runtime.
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'net.logstash.logback:logstash-logback-encoder:7.4'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'io.micrometer:micrometer-registry-prometheus'
    api 'io.micrometer:micrometer-tracing-bridge-brave'
    api 'io.zipkin.reporter2:zipkin-reporter-brave'
    api 'org.springframework.kafka:spring-kafka'
    api 'org.flywaydb:flyway-core'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.cloud:spring-cloud-starter-vault-config:4.1.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier:4.1.1'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner:4.1.1'
}
