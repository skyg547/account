server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  server:
    # [유레카 자가 보존 모드 (Self-Preservation Mode)]
    # 네트워크 이중화/장애 상황에서 하트비트 수신율이 지정 임계치 미만으로 떨어질 경우 인스턴스 무분별 강제 삭제 방지
    enable-self-preservation: ${EUREKA_SERVER_ENABLE_SELF_PRESERVATION:true}
    # [수확 주기 (Eviction Interval Timer)]
    # 만료된 인스턴스를 레지스트리에서 검출하여 주기적으로 제거하는 시간 간격 (ms 단위, 기본 60000ms = 60초)
    eviction-interval-timer-in-ms: ${EUREKA_SERVER_EVICTION_INTERVAL_TIMER_IN_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: "${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}}"

logging:
  level:
    com.ho.account.discovery: INFO

---
# ===================================================================
# [고가용성(HA) Peer-Awareness 프로파일 설정: peer1]
# - peer1 노드는 peer2 노드(포트 8762)를 바라보며 레지스트리를 동기화합니다.
# ===================================================================
spring:
  config:
    activate:
      on-profile: peer1

server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:peer1}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://peer2:8762/eureka/}

---
# ===================================================================
# [고가용성(HA) Peer-Awareness 프로파일 설정: peer2]
# - peer2 노드는 peer1 노드(포트 8761)를 바라보며 레지스트리를 동기화합니다.
# ===================================================================
spring:
  config:
    activate:
      on-profile: peer2

server:
  port: ${SERVER_PORT:8762}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:peer2}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://peer1:8761/eureka/}

