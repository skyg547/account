server:
  port: 8000

spring:
  cloud:
    gateway:
      discovery:
        locator:
          # 명시적으로 허용한 lb:// route만 노출하고 /{serviceId}/** 자동 route는 생성하지 않습니다.
          # 라우팅에서 Eureka는 아래 route의 대상 인스턴스 선택에 사용하며,
          # Gateway 자체 Eureka 등록과 registry fetch 동작에는 영향을 주지 않습니다.
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - https://*.myaccount.com
              - https://*.trycloudflare.com
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - X-Request-Id
              - X-Auth-Error
              - Authorization
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@requestRateKeyResolver}"
            rate-limiter: "#{@inMemoryRateLimiter}"
        - RemoveRequestHeader=X-Bff-Rate-Key
        - RemoveRequestHeader=X-Bff-Rate-Timestamp
        - RemoveRequestHeader=X-Bff-Rate-Signature
      routes:
        # 아래 명시 route 목록만 외부 경로로 노출합니다. Eureka service ID를 경로 prefix로 노출하지 않습니다.
        # Auth 로그인만 외부 공개합니다. validate/internal 경로는 Gateway 전역 정책에서 차단합니다.
        - id: auth-login-api
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/login
            - Method=POST

        # JwtAuthenticationFilter 전역 필터가 모든 /api/**를 먼저 검증한 뒤 아래 라우트로 보냅니다.
        # Master Data Service 라우팅
        - id: master-data-api
          uri: lb://master-data
          predicates:
            - Path=/api/basic/**,/api/master-data/**
          filters:
            - name: CircuitBreaker # 2차 방어막: 뒷단 죽었는지 검사
              args:
                name: masterDataCircuitBreaker
                fallbackUri: forward:/fallback/master-data
        
        # Journal Ledger Service 라우팅
        - id: journal-ledger-api
          uri: lb://journal-ledger
          predicates:
            - Path=/api/journals/**,/api/ledgers/**,/api/unsettled/**,/api/gl-sl/**,/api/drilldown/**
          filters:
            - name: CircuitBreaker
              args:
                name: journalLedgerCircuitBreaker
                fallbackUri: forward:/fallback/journal-ledger

        # Closing Service 라우팅. 구 모놀리식 catch-all보다 먼저 선언해 결산 명령이 전용 서비스로 갑니다.
        - id: closing-api
          uri: lb://closing-service
          predicates:
            - Path=/api/closing/**
          filters:
            - name: CircuitBreaker
              args:
                name: closingCircuitBreaker
                fallbackUri: forward:/fallback/closing

        # 예산 API를 레거시 catch-all보다 먼저 선언해 /api/budgets/**가 새 Budget 서비스로 전달되게 합니다.
        # 인증은 이 라우트가 아니라 기존 전역 JwtAuthenticationFilter가 모든 /api/**에 동일하게 적용합니다.
        - id: budget-api
          uri: lb://budget-api
          predicates:
            - Path=/api/budgets/**
          filters:
            - name: CircuitBreaker
              args:
                name: budgetCircuitBreaker
                fallbackUri: forward:/fallback/budget

        # Internal Audit API is a dedicated service and must not fall through
        # to the legacy account monolith route.
        - id: internal-audit-api
          uri: lb://internal-audit-service
          predicates:
            - Path=/api/v1/internalaudit/**
          filters:
            - name: CircuitBreaker
              args:
                name: internalAuditCircuitBreaker
                fallbackUri: forward:/fallback/internal-audit

        # Deposit Service 라우팅
        - id: deposit-api
          uri: lb://deposit-service
          predicates:
            - Path=/api/deposits/**,/api/v1/deposit/**
          filters:
            - name: CircuitBreaker
              args:
                name: depositCircuitBreaker
                fallbackUri: forward:/fallback/deposit

        # Receivable Service 라우팅
        - id: receivable-api
          uri: lb://receivable-api
          predicates:
            - Path=/api/collections/**,/api/sales/**,/api/v1/receivable/**
          filters:
            - name: CircuitBreaker
              args:
                name: receivableCircuitBreaker
                fallbackUri: forward:/fallback/receivable

        # Payable Service 라우팅
        - id: payable-api
          uri: lb://payable-api
          predicates:
            - Path=/api/payments/**,/api/purchase/**,/api/v1/payable/**
          filters:
            - name: CircuitBreaker
              args:
                name: payableCircuitBreaker
                fallbackUri: forward:/fallback/payable

        # Tax Service 라우팅
        - id: tax-api
          uri: lb://tax-api
          predicates:
            - Path=/api/ap/invoices/**,/api/v1/tax/**
          filters:
            - name: CircuitBreaker
              args:
                name: taxCircuitBreaker
                fallbackUri: forward:/fallback/tax

        # Reconciliation Service 라우팅
        - id: reconciliation-api
          uri: lb://reconciliation-api
          predicates:
            - Path=/api/reconciliation/**,/api/v1/reconciliation/**
          filters:
            - name: CircuitBreaker
              args:
                name: reconciliationCircuitBreaker
                fallbackUri: forward:/fallback/reconciliation

        # Asset Lease Service 라우팅
        - id: asset-lease-api
          uri: lb://asset-lease-service
          predicates:
            - Path=/api/fixed-assets/**,/api/ifrs16/leases/**,/api/v1/asset-lease/**
          filters:
            - name: CircuitBreaker
              args:
                name: assetLeaseCircuitBreaker
                fallbackUri: forward:/fallback/asset-lease

        # Reporting Service 라우팅
        - id: reporting-api
          uri: lb://reporting-api
          predicates:
            - Path=/api/v1/reporting/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportingCircuitBreaker
                fallbackUri: forward:/fallback/reporting

        # Expenditure Resolution Service 라우팅
        - id: expenditure-resolution-api
          uri: lb://expenditure-resolution-api
          predicates:
            - Path=/api/ap/payments/**,/api/expenditures/**,/api/v1/expenditure/**
          filters:
            - name: CircuitBreaker
              args:
                name: expenditureResolutionCircuitBreaker
                fallbackUri: forward:/fallback/expenditure

        # Account Mart Service 라우팅
        - id: account-mart-api
          uri: lb://account-mart-api
          predicates:
            - Path=/api/v1/mart/**,/api/v1/market-data/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountMartCircuitBreaker
                fallbackUri: forward:/fallback/mart

        # ECL Service 라우팅
        - id: ecl-api
          uri: lb://ifrs9-allowance-api
          predicates:
            - Path=/api/v1/ifrs/allowance/**,/api/v1/ecl/**
          filters:
            - name: CircuitBreaker
              args:
                name: eclCircuitBreaker
                fallbackUri: forward:/fallback/ecl

        # OpenAPI (Swagger) 문서 긁어오기 라우팅
        - id: openapi-master-data
          uri: lb://master-data
          predicates:
            - Path=/v3/api-docs/master-data
          filters:
            - RewritePath=/v3/api-docs/master-data, /v3/api-docs
        - id: openapi-journal-ledger
          uri: lb://journal-ledger
          predicates:
            - Path=/v3/api-docs/journal-ledger
          filters:
            - RewritePath=/v3/api-docs/journal-ledger, /v3/api-docs
        - id: openapi-auth
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

springdoc:
  swagger-ui:
    # 게이트웨이에서 여러 서비스의 메뉴판을 합쳐서(Aggregate) 보여주는 설정입니다.
    urls:
      - {name: "Master Data Service", url: "/v3/api-docs/master-data"}
      - {name: "Journal Ledger Service", url: "/v3/api-docs/journal-ledger"}
      - {name: "Auth Service", url: "/v3/api-docs/auth-service"}

# --- Resilience4j 두꺼비집 민감도 설정 ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true # 헬스 체크(Prometheus)에 두꺼비집 상태(Open/Closed) 노출
        slidingWindowSize: 10 # 최근 10개의 요청을 검사해서
        failureRateThreshold: 50 # 절반 이상(50%)이 실패하면 두꺼비집을 팍 내림(Open)!
        waitDurationInOpenState: 10000 # 10초 동안 내린 채로 유지하다가 슬쩍 올려봄(Half-Open)
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      depositCircuitBreaker:
        baseConfig: default
      receivableCircuitBreaker:
        baseConfig: default
      payableCircuitBreaker:
        baseConfig: default
      taxCircuitBreaker:
        baseConfig: default
      reconciliationCircuitBreaker:
        baseConfig: default
      assetLeaseCircuitBreaker:
        baseConfig: default
      reportingCircuitBreaker:
        baseConfig: default
      expenditureResolutionCircuitBreaker:
        baseConfig: default
      accountMartCircuitBreaker:
        baseConfig: default
      eclCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s # 뒷단 서버가 3초 이상 묵묵부답이면 강제로 통신을 끊고 실패(Fallback) 처리!

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

# --- Monitoring: 프로메테우스 및 Zipkin ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}}"

logging:
  level:
    com.ho.account.gateway: INFO

gateway:
  bff:
    shared-secret: ${BFF_GATEWAY_SHARED_SECRET:}
