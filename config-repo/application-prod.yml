spring:
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${PROD_DB_POOL_MINIMUM_IDLE:2}
      maximum-pool-size: ${PROD_DB_POOL_MAXIMUM_SIZE:20}
      connection-timeout: ${PROD_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${PROD_DB_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${PROD_KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${PROD_REDIS_HOST}
      port: ${PROD_REDIS_PORT}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
