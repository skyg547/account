spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:5432/${DB_NAME:account_dev}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD:dev_pass}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka}:9092

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
