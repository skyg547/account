      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      BUDGET_DISCOVERY_ENABLED: "true"
      BUDGET_EUREKA_ENABLED: "true"
      SPRING_DATASOURCE_URL: "${BUDGET_DB_URL:?Set BUDGET_DB_URL in the untracked environment file}"
      SPRING_DATASOURCE_USERNAME: "${BUDGET_DB_USER:?Set BUDGET_DB_USER in the untracked environment file}"
      SPRING_DATASOURCE_PASSWORD: "${BUDGET_DB_PASSWORD:?Set BUDGET_DB_PASSWORD in the untracked environment file}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in the untracked environment file}"

  budget-batch:
