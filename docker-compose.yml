      SPRING_DATASOURCE_URL: "${ASSET_LEASE_DB_URL:?Set ASSET_LEASE_DB_URL in the untracked environment file}"
      SPRING_DATASOURCE_USERNAME: "${ASSET_LEASE_DB_USER:?Set ASSET_LEASE_DB_USER in the untracked environment file}"
      SPRING_DATASOURCE_PASSWORD: "${ASSET_LEASE_DB_PASSWORD:?Set ASSET_LEASE_DB_PASSWORD in the untracked environment file}"

  asset-lease-batch:
