      SPRING_DATASOURCE_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the untracked environment file}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in the untracked environment file}"
      AUTH_DEFAULT_PASSWORD: "${AUTH_DEFAULT_PASSWORD:?Set AUTH_DEFAULT_PASSWORD in the untracked environment file}"
      AUTH_INTERNAL_API_TOKEN: "${AUTH_INTERNAL_API_TOKEN:?Set AUTH_INTERNAL_API_TOKEN in the untracked environment file}"

  budget-api:
