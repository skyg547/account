version: "3.8"

name: ${COMPOSE_PROJECT_NAME:-account-dev}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-runtime-environment: &common-runtime-environment
  SPRING_PROFILES_ACTIVE: dev
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "${DEV_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
  SPRING_DATA_REDIS_HOST: "${DEV_REDIS_HOST:-redis}"
  SPRING_DATA_REDIS_PORT: "${DEV_REDIS_PORT:-6379}"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
  EUREKA_CLIENT_ENABLED: "true"
  SPRING_CLOUD_DISCOVERY_ENABLED: "true"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_OPEN_IN_VIEW: "false"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_FLYWAY_CLEAN_DISABLED: "true"
  SPRING_SQL_INIT_MODE: never
  SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: never

x-config-client-environment: &config-client-environment
  SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
  SPRING_CLOUD_CONFIG_ENABLED: "true"

x-api-service: &api-service
  restart: on-failure
  init: true
  environment:
    <<: *common-runtime-environment
    SERVER_PORT: "8080"
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  depends_on:
    config-server:
      condition: service_healthy
    discovery:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
    interval: 20s
    timeout: 5s
    retries: 12
    start_period: 60s
  logging: *default-logging
  networks: [account-network]

x-batch-service: &batch-service
  restart: "no"
  init: true
  environment:
    <<: *common-runtime-environment
    SPRING_MAIN_WEB_APPLICATION_TYPE: none
    SPRING_BATCH_JOB_ENABLED: "false"
  depends_on:
    config-server:
      condition: service_healthy
    discovery:
      condition: service_healthy
  logging: *default-logging
  networks: [account-network]

services:
  postgres-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["self-contained"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_ADMIN_DB:-postgres}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-account_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-}"
      ACCOUNT_DATABASES: "${ACCOUNT_DATABASES:-auth_dev,master_data_dev,internal_audit_dev,budget_dev,journal_ledger_dev,closing_dev,loan_dev,deposit_dev,asset_lease_dev,payable_dev,receivable_dev,reconciliation_dev,tax_dev,expenditure_resolution_dev,reporting_dev,account_mart_dev,ecl_dev}"
      ACCOUNT_DB_OWNER_PASSWORD: "${ACCOUNT_DB_OWNER_PASSWORD:-}"
      ACCOUNT_DB_APP_PASSWORD: "${ACCOUNT_DB_APP_PASSWORD:-}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/runtime:/account-runtime:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && test "$$(psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --no-psqlrc --tuples-only --no-align --quiet --command "SELECT database_manifest FROM public.account_dev_bootstrap_status WHERE singleton = true AND completed = true")" = "$$ACCOUNT_DATABASES"'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    logging: *default-logging
    networks: [account-network]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    profiles: ["self-contained"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks: [account-network]

  kafka:
    image: ${KAFKA_IMAGE:-bitnami/kafka:3.7}
    profiles: ["self-contained"]
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks: [account-network]

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
      SERVER_PORT: "8888"
      ENCRYPT_KEY: ${ENCRYPT_KEY:?ENCRYPT_KEY must be supplied by an approved secret provider}
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    networks: [account-network]

  discovery:
    build:
      context: .
      dockerfile: discovery/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SERVER_PORT: "8761"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging: *default-logging
    networks: [account-network]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    profiles: ["platform", "apis"]
    restart: on-failure
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8000"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in the untracked environment file}"
      AUTH_TOKEN_VERSION_VALIDATION_BASE_URL: http://auth-api:8080
    depends_on:
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks: [account-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile.dev
    profiles: ["platform", "apis"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      GATEWAY_INTERNAL_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    logging: *default-logging
    networks: [account-network]

  migration-runner:
    build:
      context: .
      dockerfile: Containerfile
      args:
        GRADLE_PROJECT: ":migration-runner"
        JAR_DIRECTORY: migration-runner
    profiles: ["migration"]
    restart: "no"
    environment:
      MIGRATION_DB_URL: "${MIGRATION_DB_URL:-}"
      MIGRATION_DB_USER: "${MIGRATION_DB_USER:-}"
      MIGRATION_DB_PASSWORD: "${MIGRATION_DB_PASSWORD:-}"
      MIGRATION_TARGET_ENV: development
      MIGRATION_EXPECTED_DATABASE: "${MIGRATION_EXPECTED_DATABASE:-}"
      MIGRATION_ALLOW_MIGRATE: "${MIGRATION_ALLOW_MIGRATE:-false}"
      MIGRATION_CHANGE_TICKET: "${MIGRATION_CHANGE_TICKET:-}"
    command:
      - "--context=${MIGRATION_CONTEXT:-__context_required__}"
      - "--action=${MIGRATION_ACTION:-validate}"
    logging: *default-logging
    networks: [account-network]

  runtime-grants:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["migration"]
    restart: "no"
    environment:
      PGHOST: "${GRANT_DB_HOST:-postgres-db}"
      PGPORT: "${GRANT_DB_PORT:-5432}"
      PGPASSWORD: "${POSTGRES_ADMIN_PASSWORD:-}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-account_admin}"
      ACCOUNT_DATABASES: "${ACCOUNT_DATABASES:-auth_dev,master_data_dev,internal_audit_dev,budget_dev,journal_ledger_dev,closing_dev,loan_dev,deposit_dev,asset_lease_dev,payable_dev,receivable_dev,reconciliation_dev,tax_dev,expenditure_resolution_dev,reporting_dev,account_mart_dev,ecl_dev}"
    volumes:
      - ./postgres/runtime:/account-runtime:ro
    command: ["sh", "/account-runtime/grant-runtime-privileges.sh"]
    logging: *default-logging
    networks: [account-network]

  account-mart-api:
    <<: *api-service
    profiles: ["apis", "risk"]
    build: {context: ., dockerfile: account-mart/mart-api/Dockerfile}
    environment:
      <<: [*common-runtime-environment, *config-client-environment]
      SERVER_PORT: "8080"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_DATASOURCE_URL: "${ACCOUNT_MART_DB_URL:?Set ACCOUNT_MART_DB_URL in the untracked environment file}"
      SPRING_DATASOURCE_USERNAME: "${ACCOUNT_MART_DB_USER:?Set ACCOUNT_MART_DB_USER in the untracked environment file}"
      SPRING_DATASOURCE_PASSWORD: "${ACCOUNT_MART_DB_PASSWORD:?Set ACCOUNT_MART_DB_PASSWORD in the untracked environment file}"

  account-mart-batch:
    <<: *batch-service
    profiles: ["batch"]
    build: {context: ., dockerfile: account-mart/mart-batch/Dockerfile}
    environment:
      <<: *common-runtime-environment
