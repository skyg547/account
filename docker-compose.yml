      SPRING_DATASOURCE_URL: "${ACCOUNT_MART_DB_URL:?Set ACCOUNT_MART_DB_URL in the untracked environment file}"
      SPRING_DATASOURCE_USERNAME: "${ACCOUNT_MART_DB_USER:?Set ACCOUNT_MART_DB_USER in the untracked environment file}"
      SPRING_DATASOURCE_PASSWORD: "${ACCOUNT_MART_DB_PASSWORD:?Set ACCOUNT_MART_DB_PASSWORD in the untracked environment file}"

  asset-lease-api:
