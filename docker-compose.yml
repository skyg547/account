version: '3.8'

services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - JAVA_OPTS=${JAVA_OPTS}
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-1.0}'
          memory: ${DOCKER_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${DOCKER_MEMORY_RESERVATION:-1G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
