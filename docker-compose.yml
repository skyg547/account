      SPRING_DATASOURCE_USERNAME: "${JOURNAL_LEDGER_DB_USER:?Set JOURNAL_LEDGER_DB_USER in the untracked environment file}"
      SPRING_DATASOURCE_PASSWORD: "${JOURNAL_LEDGER_DB_PASSWORD:?Set JOURNAL_LEDGER_DB_PASSWORD in the untracked environment file}"

  loan-api:
    <<: *api-service
    profiles: ["apis", "products"]
    build: {context: ., dockerfile: loan/api/Dockerfile}
    environment:
