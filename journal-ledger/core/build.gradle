
plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}
description = 'account-journal-ledger-core'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.5"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}
dependencies {
    api project(':contracts')
    api project(':shared-kernel')
    api project(':internal-audit:core')
    
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
}
jar { enabled = true }


tasks.named('compileJava').configure {
    doFirst {
        println 'IN DOFIRST'
    }
}

// The runtime classpath contains transitive bounded-context jars. Copy Journal
// migrations to an owned location so Flyway never discovers another context's V1.
tasks.named('processResources').configure {
    from('src/main/resources/db/migration') {
        include '*.sql'
        into 'db/journal-migration'
    }
}

