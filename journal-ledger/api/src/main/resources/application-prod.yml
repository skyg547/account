spring:
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT:5432}/${PROD_DB_NAME}?sslmode=verify-full
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never

journal-ledger:
  master-data:
    base-url: ${MASTER_DATA_BASE_URL}
    connect-timeout: ${MASTER_DATA_CONNECT_TIMEOUT:2s}
    read-timeout: ${MASTER_DATA_READ_TIMEOUT:5s}
    local-adapter:
      enabled: false
    remote:
      enabled: true
