# ==============================================================================
# Journal Ledger API Module - Default Configuration
# ==============================================================================
# [Architecture & Pedagogical Explanation / 교육적 주석]
# 1. Default Profile Setting (기본 프로파일 설정)
#    - 별도의 active profile 지정 없이 애플리케이션 구동 시 'local' 프로파일을 기본값으로 사용합니다.
#    - 로컬 개발 환경 및 오프라인 테스트 환경에서 외부 인프라 서비스 접속 없이 즉시 구동 가능함을 보장합니다.
#
# 2. External Service Decoupling (외부 제어 서비스 디커플링)
#    - Config Server, Eureka Discovery, Vault 등 MSA 제어 서버 연동을 기본 비활성화하여
#      단독(Standalone/Self-contained) 런타임으로 동작할 수 있도록 디커플링합니다.
# ==============================================================================

server:
  port: ${SERVER_PORT:8081}

journal-ledger:
  kafka:
    recovery:
      # Two retries follow the initial delivery; exhausted records publish to <source-topic>.DLT.
      retry-interval-ms: ${JOURNAL_KAFKA_RETRY_INTERVAL_MS:1000}
      max-retries: ${JOURNAL_KAFKA_MAX_RETRIES:2}
      dlt-suffix: ${JOURNAL_KAFKA_DLT_SUFFIX:.DLT}
  master-data:
    local-adapter:
      enabled: true
    remote:
      enabled: false

spring:
  application:
    name: journal-ledger-api
  jpa:
    # Explicit mapping avoids loading journal tables in other services that depend on core.
    mapping-resources: META-INF/journal-ledger-orm.xml
  jackson:
    # Untyped financial decimals must not pass through binary floating point; integers stay integral.
    deserialization:
      use-big-decimal-for-floats: true
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/journal-migration
    clean-disabled: true
    baseline-on-migrate: false
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    vault:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
