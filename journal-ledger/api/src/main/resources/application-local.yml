# ==============================================================================
# Journal Ledger API Module - Local Profile
# ==============================================================================
# 이 파일은 journal-ledger-api를 외부 인프라 없이 단독 기동시키기 위한 설정이다.
#
# 초보자 설명:
#   "프로파일"은 실행 환경별 설정 묶음이다. local은 개발자 PC나 테스트에서
#   PostgreSQL, Config Server, Eureka, Kafka, Zipkin 같은 외부 서버 없이
#   혼자 돌 수 있게 한다.
#
#   base application.yml이 이미 cloud/eureka 비활성을 담당하므로, 여기서는
#   DB와 관측·메시징 스택만 추가로 끈다. 이 셋을 끄지 않으면 기동 시 존재하지
#   않는 서버에 접속을 시도하며 로그가 오염되거나 기동이 지연된다.
# ==============================================================================

spring:
  config:
    activate:
      on-profile: local

  datasource:
    # DB_CLOSE_DELAY=-1 을 주지 않으면 마지막 커넥션이 닫힐 때 인메모리 DB가
    # 통째로 사라져, 같은 JVM 안에서도 스키마가 증발한다.
    url: jdbc:h2:mem:journal_ledger_api_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # SQL을 콘솔에 찍고 싶으면 아래 주석 블록을 켠다. 기본은 끈 상태다 —
    # 켜두면 테스트 로그가 Hibernate DDL/SQL 덤프로 덮여 실패 원인을 찾기 어렵다.
    # show-sql: true
    # properties:
    #   hibernate:
    #     format_sql: true

  # 도메인 스키마는 위 ddl-auto가 만든다. SQL 초기화 스크립트는 쓰지 않는다.
  # (flyway.enabled는 base application.yml이 이미 false로 두므로 재정의하지 않는다.)
  sql:
    init:
      mode: never

  # 로컬에는 브로커가 없다. auto-startup을 켜두면 리스너가 기동 직후부터
  # 연결 재시도를 반복한다.
  kafka:
    listener:
      auto-startup: false

# 로컬에는 Zipkin 등 수집기가 없으므로 트레이스 전송을 끈다.
management:
  tracing:
    enabled: false
