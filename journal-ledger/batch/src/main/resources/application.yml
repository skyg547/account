spring:
  application:
    name: journal-ledger-batch
  jpa:
    # Explicit mapping avoids loading journal tables in other services that depend on core.
    mapping-resources: META-INF/journal-ledger-orm.xml
  profiles:
    default: local
  main:
    web-application-type: none
  flyway:
    enabled: false
    locations: classpath:db/journal-migration
    clean-disabled: true
    baseline-on-migrate: false
  batch:
    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
