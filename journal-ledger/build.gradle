plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'account-journal-ledger'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.5')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.2.5')

    implementation project(':contracts')
    implementation project(':shared-kernel')
    implementation project(':master-data')
    implementation project(':governance')

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    mainClass = 'com.ho.account.journalledger.JournalLedgerApplication'
}
