# ==============================================================================
# Expenditure Resolution API Service - Test Local Profile Configuration
# ==============================================================================
# [Architecture & Pedagogical Explanation]
# 1. Profile Isolation & Test Environment Decoupling:
#    - 로컬 및 테스트 환경에서 외부 PostgreSQL DB, Eureka Discovery, Config Server, Vault 등
#      인프라스트럭처 제어 플레인에 의존하지 않고 독립적으로 테스트를 구동하기 위한 local 프로파일 전용 설정입니다.
# 2. In-Memory H2 Database Integration:
#    - H2 인메모리 데이터베이스(`jdbc:h2:mem:expenditure_resolution_api_db;MODE=PostgreSQL`)를 사용하여
#      PostgreSQL 호환 모드로 동작시킴으로써 실제 운영 RDB 환경과의 호환성을 유지하면서 속도 및 데이터 격리성을 보장합니다.
# 3. Flyway Migration & JPA Schema Validation:
#    - Flyway 데이터베이스 마이그레이션을 활성화하여(`locations: classpath:db/expenditure-resolution-migration`)
#      테스트 시작 시 스키마 마이그레이션을 정합성 있게 로드하고
#      `spring.jpa.hibernate.ddl-auto: validate`를 통해 JPA 엔티티와 DB DDL 매핑 정합성을 검증합니다.
# 4. External Infrastructure Controls:
#    - Vault, Cloud Config, Eureka Client, Kafka 등 외부 연동 구성 요소를 비활성화하여
#      단위 및 통합 테스트가 외부 네트워크 또는 외부 인프라 서비스 없이 안정적으로 실행되도록 합니다.
# ==============================================================================

spring:
  application:
    name: expenditure-resolution-api
  datasource:
    url: jdbc:h2:mem:expenditure_resolution_api_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/expenditure-resolution-migration
    clean-disabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never
  cloud:
    vault:
      enabled: false
    discovery:
      enabled: false
    config:
      enabled: false
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

management:
  health:
    vault:
      enabled: false
  tracing:
    enabled: false
