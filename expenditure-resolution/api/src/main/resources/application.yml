server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: expenditure-resolution-api
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/expenditure-resolution-migration
    clean-disabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
