plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'account-expenditure-resolution-api'
group = "${rootProject.group}.expenditure"

base {
    archivesName = 'account-expenditure-resolution-api'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation project(':expenditure-resolution:core')
    implementation project(':contracts')
    implementation project(':shared-kernel')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation project(':tax:core')
    testImplementation project(':tax:api')
    testImplementation project(':master-data:core')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sourceSets.test.java.srcDir rootProject.file('test-support/runtime-contracts/src/test/java')

bootRun {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}

bootJar { enabled = true }
jar { enabled = false }

springBoot {
    mainClass = 'com.ho.account.expenditure.resolution.api.ExpenditureResolutionApiApplication'
}

