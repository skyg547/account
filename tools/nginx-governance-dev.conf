# Rendered by the official nginx entrypoint using the current container DNS.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /grafana {
        # Keep Location relative so the browser retains the public port (8080),
        # not Nginx's internal listening port (80), when adding the trailing slash.
        absolute_redirect off;
        return 301 /grafana/;
    }

    location /grafana/ {
        # Variable upstream resolution survives recreated containers and new IPs.
        set $grafana_backend http://grafana:3000;
        proxy_pass $grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        # /api remains behind the frontend BFF; preserve the port for origin checks.
        set $frontend_backend http://minimal-frontend:3000;
        proxy_pass $frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
