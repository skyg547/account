name: account-risk-external-dev

x-external-dev-profile: &external-dev-profile
  profiles: ["external-dev"]

x-api-resource-limit: &api-resource-limit
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 768m
        pids: 256
      reservations:
        memory: 256m

x-api-healthcheck: &api-healthcheck
  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 45s

services:
  risk-db-check:
    <<: *external-dev-profile
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    read_only: true
    environment:
      ACCOUNT_MART_DB_URL: "${ACCOUNT_MART_DB_URL:?Set ACCOUNT_MART_DB_URL in the approved env file}"
      ACCOUNT_MART_DB_USER: "${ACCOUNT_MART_DB_USER:?Set ACCOUNT_MART_DB_USER in the approved env file}"
      ACCOUNT_MART_DB_PASSWORD: "${ACCOUNT_MART_DB_PASSWORD:?Set ACCOUNT_MART_DB_PASSWORD in the approved env file}"
      ECL_DB_URL: "${ECL_DB_URL:?Set ECL_DB_URL in the approved env file}"
      ECL_DB_USER: "${ECL_DB_USER:?Set ECL_DB_USER in the approved env file}"
      ECL_DB_PASSWORD: "${ECL_DB_PASSWORD:?Set ECL_DB_PASSWORD in the approved env file}"
      RECONCILIATION_DB_URL: "${RECONCILIATION_DB_URL:?Set RECONCILIATION_DB_URL in the approved env file}"
      RECONCILIATION_DB_USER: "${RECONCILIATION_DB_USER:?Set RECONCILIATION_DB_USER in the approved env file}"
      RECONCILIATION_DB_PASSWORD: "${RECONCILIATION_DB_PASSWORD:?Set RECONCILIATION_DB_PASSWORD in the approved env file}"
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    volumes:
      - ./check-risk-databases.sh:/account-runtime/check-risk-databases.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/account-runtime/check-risk-databases.sh"]
      interval: 15s
      timeout: 30s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192m
          pids: 64
    networks: [account-network]

  account-mart-api:
    <<: [*external-dev-profile, *api-resource-limit]
    build:
      context: ..
      dockerfile: tools/Containerfile.minimal-auth-java
      args:
        GRADLE_PROJECT: :account-mart:mart-api
        JAR_DIRECTORY: account-mart/mart-api
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT:-configserver:http://minimal-config-server:8888/}"
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_CLOUD_DISCOVERY_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      # Preserve the case-sensitive Eureka Map key through a JVM property.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -Djava.security.egd=file:/dev/./urandom -Deureka.client.serviceUrl.defaultZone=http://minimal-discovery:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "${ACCOUNT_MART_DB_URL:?Set ACCOUNT_MART_DB_URL in the approved env file}"
      SPRING_DATASOURCE_USERNAME: "${ACCOUNT_MART_DB_USER:?Set ACCOUNT_MART_DB_USER in the approved env file}"
      SPRING_DATASOURCE_PASSWORD: "${ACCOUNT_MART_DB_PASSWORD:?Set ACCOUNT_MART_DB_PASSWORD in the approved env file}"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      LOGGING_CONFIG: file:/account-runtime/logback-minimal-console.xml
    depends_on:
      risk-db-check:
        condition: service_healthy
    volumes:
      - ./logback-minimal-console.xml:/account-runtime/logback-minimal-console.xml:ro
    healthcheck:
      <<: *api-healthcheck
    networks: [account-network]

  ecl-api:
    <<: [*external-dev-profile, *api-resource-limit]
    build:
      context: ..
      dockerfile: tools/Containerfile.minimal-auth-java
      args:
        GRADLE_PROJECT: :ecl:ecl-api
        JAR_DIRECTORY: ecl/ecl-api
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT:-configserver:http://minimal-config-server:8888/}"
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_CLOUD_DISCOVERY_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      # Preserve the case-sensitive Eureka Map key through a JVM property.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -Djava.security.egd=file:/dev/./urandom -Deureka.client.serviceUrl.defaultZone=http://minimal-discovery:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "${ECL_DB_URL:?Set ECL_DB_URL in the approved env file}"
      SPRING_DATASOURCE_USERNAME: "${ECL_DB_USER:?Set ECL_DB_USER in the approved env file}"
      SPRING_DATASOURCE_PASSWORD: "${ECL_DB_PASSWORD:?Set ECL_DB_PASSWORD in the approved env file}"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      LOGGING_CONFIG: file:/account-runtime/logback-minimal-console.xml
    depends_on:
      risk-db-check:
        condition: service_healthy
    volumes:
      - ./logback-minimal-console.xml:/account-runtime/logback-minimal-console.xml:ro
    healthcheck:
      <<: *api-healthcheck
    networks: [account-network]

  reconciliation-api:
    <<: [*external-dev-profile, *api-resource-limit]
    build:
      context: ..
      dockerfile: tools/Containerfile.minimal-auth-java
      args:
        GRADLE_PROJECT: :reconciliation:api
        JAR_DIRECTORY: reconciliation/api
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT:-configserver:http://minimal-config-server:8888/}"
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_CLOUD_DISCOVERY_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      # Preserve the case-sensitive Eureka Map key through a JVM property.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -Djava.security.egd=file:/dev/./urandom -Deureka.client.serviceUrl.defaultZone=http://minimal-discovery:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "${RECONCILIATION_DB_URL:?Set RECONCILIATION_DB_URL in the approved env file}"
      SPRING_DATASOURCE_USERNAME: "${RECONCILIATION_DB_USER:?Set RECONCILIATION_DB_USER in the approved env file}"
      SPRING_DATASOURCE_PASSWORD: "${RECONCILIATION_DB_PASSWORD:?Set RECONCILIATION_DB_PASSWORD in the approved env file}"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      LOGGING_CONFIG: file:/account-runtime/logback-minimal-console.xml
    depends_on:
      risk-db-check:
        condition: service_healthy
    volumes:
      - ./logback-minimal-console.xml:/account-runtime/logback-minimal-console.xml:ro
    healthcheck:
      <<: *api-healthcheck
    networks: [account-network]

networks:
  account-network:
    name: ${ACCOUNT_NETWORK_NAME:-account-network}
    external: true
