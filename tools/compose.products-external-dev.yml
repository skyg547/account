name: account-products-external-dev

x-external-dev-profile: &external-dev-profile
  profiles: ["external-dev"]

x-api-resource-limit: &api-resource-limit
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 768m
        pids: 256
      reservations:
        memory: 256m

x-api-healthcheck: &api-healthcheck
  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 45s

services:
  products-db-check:
    <<: *external-dev-profile
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    read_only: true
    environment:
      DEPOSIT_DB_URL: "${DEPOSIT_DB_URL:?Set DEPOSIT_DB_URL in the approved env file}"
      DEPOSIT_DB_USER: "${DEPOSIT_DB_USER:?Set DEPOSIT_DB_USER in the approved env file}"
      DEPOSIT_DB_PASSWORD: "${DEPOSIT_DB_PASSWORD:?Set DEPOSIT_DB_PASSWORD in the approved env file}"
      LOAN_DB_URL: "${LOAN_DB_URL:?Set LOAN_DB_URL in the approved env file}"
      LOAN_DB_USER: "${LOAN_DB_USER:?Set LOAN_DB_USER in the approved env file}"
      LOAN_DB_PASSWORD: "${LOAN_DB_PASSWORD:?Set LOAN_DB_PASSWORD in the approved env file}"
      ASSET_LEASE_DB_URL: "${ASSET_LEASE_DB_URL:?Set ASSET_LEASE_DB_URL in the approved env file}"
      ASSET_LEASE_DB_USER: "${ASSET_LEASE_DB_USER:?Set ASSET_LEASE_DB_USER in the approved env file}"
      ASSET_LEASE_DB_PASSWORD: "${ASSET_LEASE_DB_PASSWORD:?Set ASSET_LEASE_DB_PASSWORD in the approved env file}"
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    volumes:
      - ./check-products-databases.sh:/account-runtime/check-products-databases.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/account-runtime/check-products-databases.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192m
          pids: 64
    networks: [account-network]

  deposit-api:
    <<: [*external-dev-profile, *api-resource-limit]
    build:
      context: ..
      dockerfile: tools/Containerfile.minimal-auth-java
      args:
        GRADLE_PROJECT: :deposit:api
        JAR_DIRECTORY: deposit/api
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT:-configserver:http://minimal-config-server:8888/}"
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://minimal-discovery:8761/eureka/}"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "${DEPOSIT_DB_URL:?Set DEPOSIT_DB_URL in the approved env file}"
      SPRING_DATASOURCE_USERNAME: "${DEPOSIT_DB_USER:?Set DEPOSIT_DB_USER in the approved env file}"
      SPRING_DATASOURCE_PASSWORD: "${DEPOSIT_DB_PASSWORD:?Set DEPOSIT_DB_PASSWORD in the approved env file}"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      LOGGING_CONFIG: file:/account-runtime/logback-minimal-console.xml
    depends_on:
      products-db-check:
        condition: service_healthy
    volumes:
      - ./logback-minimal-console.xml:/account-runtime/logback-minimal-console.xml:ro
    healthcheck:
      <<: *api-healthcheck
    networks: [account-network]

  loan-api:
    <<: [*external-dev-profile, *api-resource-limit]
    build:
      context: ..
      dockerfile: tools/Containerfile.minimal-auth-java
      args:
        GRADLE_PROJECT: :loan:api
        JAR_DIRECTORY: loan/api
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT:-configserver:http://minimal-config-server:8888/}"
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://minimal-discovery:8761/eureka/}"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "${LOAN_DB_URL:?Set LOAN_DB_URL in the approved env file}"
      SPRING_DATASOURCE_USERNAME: "${LOAN_DB_USER:?Set LOAN_DB_USER in the approved env file}"
      SPRING_DATASOURCE_PASSWORD: "${LOAN_DB_PASSWORD:?Set LOAN_DB_PASSWORD in the approved env file}"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      LOGGING_CONFIG: file:/account-runtime/logback-minimal-console.xml
    depends_on:
      products-db-check:
        condition: service_healthy
    volumes:
      - ./logback-minimal-console.xml:/account-runtime/logback-minimal-console.xml:ro
    healthcheck:
      <<: *api-healthcheck
    networks: [account-network]

  asset-lease-api:
    <<: [*external-dev-profile, *api-resource-limit]
    build:
      context: ..
      dockerfile: tools/Containerfile.minimal-auth-java
      args:
        GRADLE_PROJECT: :asset-lease:api
        JAR_DIRECTORY: asset-lease/api
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT:-configserver:http://minimal-config-server:8888/}"
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://minimal-discovery:8761/eureka/}"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: "${ASSET_LEASE_DB_URL:?Set ASSET_LEASE_DB_URL in the approved env file}"
      SPRING_DATASOURCE_USERNAME: "${ASSET_LEASE_DB_USER:?Set ASSET_LEASE_DB_USER in the approved env file}"
      SPRING_DATASOURCE_PASSWORD: "${ASSET_LEASE_DB_PASSWORD:?Set ASSET_LEASE_DB_PASSWORD in the approved env file}"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      LOGGING_CONFIG: file:/account-runtime/logback-minimal-console.xml
    depends_on:
      products-db-check:
        condition: service_healthy
    volumes:
      - ./logback-minimal-console.xml:/account-runtime/logback-minimal-console.xml:ro
    healthcheck:
      <<: *api-healthcheck
    networks: [account-network]

networks:
  account-network:
    name: ${ACCOUNT_NETWORK_NAME:-account-network}
    external: true
