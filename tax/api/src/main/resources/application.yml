server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: tax-api
  profiles:
    default: local
  flyway:
    enabled: false
    locations: classpath:db/tax-migration
    clean-disabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
