# 이미 account-network에 Config Server, Logstash, Zipkin이 떠 있는 개발 환경에서 Discovery만 추가하는 보조 Compose입니다.
services:
  discovery:
    # 루트 Gradle 멀티모듈 파일이 필요하므로 저장소 루트를 build context로 사용합니다.
    build:
      context: ..
      dockerfile: Containerfile
      args:
        GRADLE_PROJECT: ":discovery"
        JAR_DIRECTORY: discovery
    container_name: discovery
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888/
      - EUREKA_INSTANCE_HOSTNAME=discovery
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - account-network

networks:
  account-network:
    external: true
