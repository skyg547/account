spring:
  application:
    name: closing-service
  flyway:
    enabled: true
    # Closing 서비스가 소유한 migration만 실행해 의존 모듈의 동일 버전 SQL과 충돌하지 않게 합니다.
    locations: classpath:db/closing-migration
    # 같은 DB를 쓰는 다른 모듈의 적용 이력과 검증/버전 순서를 섞지 않습니다.
    table: flyway_schema_history_closing
    # 기존 Closing 스키마에는 Flyway 이력이 없으므로 V50 직전에서 기준선을 잡습니다.
    baseline-on-migrate: true
    baseline-version: 49

server:
  port: 8086
