name: account-cloudflare-tunnel

services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    # Quick tunnels must not reopen a public URL automatically after a reboot.
    restart: "no"
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - ${CLOUDFLARE_TUNNEL_PROTOCOL:-auto}
      - --url
      - http://account-frontend-nginx:80
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    networks: [account-network]

networks:
  account-network:
    name: ${ACCOUNT_NETWORK_NAME:-account-network}
    external: true
