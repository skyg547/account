# ======================== Grafana Infrastructure Compose =========================
# 초보자를 위한 개념 설명:
# 그라파나는 메트릭(Prometheus 등)을 시각화해 주는 대시보드 서버입니다.
# provisioning 디렉터리를 read-only(:ro)로 마운트하여 Prometheus를 기본 데이터소스로 자동 연결합니다.

version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      account-network:
        aliases:
          - grafana
          - account-grafana

volumes:
  grafana-storage:

networks:
  account-network:
    external: true