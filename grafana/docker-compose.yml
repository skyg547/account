# Existing-volume development recovery; see README.md before recreating Grafana.
services:
  grafana:
    # Override with the existing image digest to avoid upgrading during recovery.
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13001}:3000"
    environment:
      # Existing admin credentials remain in the preserved database volume.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    cpus: 0.50
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      account-network:
        aliases:
          - grafana
          - account-grafana

volumes:
  # An external exact name prevents Compose from silently creating an empty DB.
  grafana-storage:
    name: grafana-storage
    external: true

networks:
  account-network:
    name: ${ACCOUNT_NETWORK_NAME:-account-network}
    external: true
