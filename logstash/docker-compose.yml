# ======================== Logstash Infrastructure Compose =========================
# 초보자를 위한 개념 설명:
# Logstash는 MSA 각 서비스에서 발생하는 실시간 로그를 수신하여 정제한 뒤 Elasticsearch로 전달합니다.

version: '3.8'

services:
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    container_name: logstash
    restart: unless-stopped
    ports:
      - "${LOGSTASH_TCP_PORT:-5000}:5000"
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/stats | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"\\|\"logstash\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024m
        reservations:
          memory: 256m
    networks:
      - account-network

networks:
  account-network:
    external: true