name: account-logstash-dev

services:
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    container_name: account-logstash-dev
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    expose:
      - "5000"
      - "9600"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:9600/_node/pipelines/main >/dev/null
          && ES_HEALTH="$$(curl --fail --silent --show-error
          'http://elasticsearch:9200/_cluster/health?wait_for_status=yellow&timeout=2s')"
          && printf '%s' "$${ES_HEALTH}"
          | grep -Eq '"timed_out"[[:space:]]*:[[:space:]]*false'
          && printf '%s' "$${ES_HEALTH}"
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(yellow|green)"'
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 640m
          pids: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      account-network:
        aliases:
          - logstash

networks:
  account-network:
    name: ${ACCOUNT_NETWORK_NAME:-account-network}
    external: true
