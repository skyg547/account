# Development-only Logstash node settings. The Compose mount is read-only.
http.host: "0.0.0.0"
http.port: 9600

# One small pipeline is enough for the constrained development server.
pipeline.id: main
pipeline.workers: 1
pipeline.batch.size: 64
pipeline.ecs_compatibility: disabled
queue.type: memory

# The mounted pipeline is immutable for one container lifecycle.
config.reload.automatic: false

# Local development monitoring is provided by the HTTP API and Prometheus work.
xpack.monitoring.enabled: false
log.level: info
