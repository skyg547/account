# ======================== Logstash Pipeline =========================
# 이 파일은 택배(로그)가 어떻게 흘러가는지 그리는 지도(작업 지시서)입니다.

# 1. 입구 (Input): 어디서 로그를 받을 것인가?
input {
  tcp {
    # Spring Boot의 logback-spring.xml에서 이 5000번 포트로 로그를 쏘고 있습니다!
    port => 5000
    # 스프링 부트에서 JSON 형태로 포장해서 보내기 때문에, 받을 때도 JSON으로 해석합니다.
    codec => json_lines
  }
}

# 2. 가공 (Filter): 받은 로그를 어떻게 예쁘게 꾸밀 것인가? (필요시 사용)
# filter {
#   # 예: 날짜 포맷 변경, 불필요한 데이터 삭제 등을 여기서 합니다.
# }

# 3. 출구 (Output): 로그를 어디로 배달할 것인가?
output {
  # 3-1. 우리의 진짜 목적지인 Elasticsearch로 전송합니다.
  elasticsearch {
    hosts => ["elasticsearch:9200"] # 도커 네트워크 내부의 Elasticsearch 주소
    
    # index는 로그를 담는 '서랍'의 이름입니다. 
    # 날짜별로 서랍을 만들면 나중에 오래된 로그를 지우기 편합니다.
    index => "account-logs-%{+YYYY.MM.dd}" 
  }

  # 3-2. (디버깅용) 로그스태시의 콘솔 화면(터미널)에도 예쁘게 출력해봅니다.
  stdout { 
    codec => rubydebug 
  }
}
