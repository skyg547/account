version: "3.8"

name: ${COMPOSE_PROJECT_NAME:-account-external-dev}

x-external-db-dependency: &external-db-dependency
  external-dev-db-check:
    condition: service_healthy

services:
  external-dev-db-check:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["external-dev", "apis", "batch"]
    restart: unless-stopped
    environment:
      ACCOUNT_MART_DB_URL: "${ACCOUNT_MART_DB_URL:?Set ACCOUNT_MART_DB_URL}"
      ACCOUNT_MART_DB_USER: "${ACCOUNT_MART_DB_USER:?Set ACCOUNT_MART_DB_USER}"
      ACCOUNT_MART_DB_PASSWORD: "${ACCOUNT_MART_DB_PASSWORD:?Set ACCOUNT_MART_DB_PASSWORD}"
      ASSET_LEASE_DB_URL: "${ASSET_LEASE_DB_URL:?Set ASSET_LEASE_DB_URL}"
      ASSET_LEASE_DB_USER: "${ASSET_LEASE_DB_USER:?Set ASSET_LEASE_DB_USER}"
      ASSET_LEASE_DB_PASSWORD: "${ASSET_LEASE_DB_PASSWORD:?Set ASSET_LEASE_DB_PASSWORD}"
      AUTH_DB_URL: "${AUTH_DB_URL:?Set AUTH_DB_URL}"
      AUTH_DB_USER: "${AUTH_DB_USER:?Set AUTH_DB_USER}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}"
      BUDGET_DB_URL: "${BUDGET_DB_URL:?Set BUDGET_DB_URL}"
      BUDGET_DB_USER: "${BUDGET_DB_USER:?Set BUDGET_DB_USER}"
      BUDGET_DB_PASSWORD: "${BUDGET_DB_PASSWORD:?Set BUDGET_DB_PASSWORD}"
      CLOSING_DB_URL: "${CLOSING_DB_URL:?Set CLOSING_DB_URL}"
      CLOSING_DB_USER: "${CLOSING_DB_USER:?Set CLOSING_DB_USER}"
      CLOSING_DB_PASSWORD: "${CLOSING_DB_PASSWORD:?Set CLOSING_DB_PASSWORD}"
      DEPOSIT_DB_URL: "${DEPOSIT_DB_URL:?Set DEPOSIT_DB_URL}"
      DEPOSIT_DB_USER: "${DEPOSIT_DB_USER:?Set DEPOSIT_DB_USER}"
      DEPOSIT_DB_PASSWORD: "${DEPOSIT_DB_PASSWORD:?Set DEPOSIT_DB_PASSWORD}"
      ECL_DB_URL: "${ECL_DB_URL:?Set ECL_DB_URL}"
      ECL_DB_USER: "${ECL_DB_USER:?Set ECL_DB_USER}"
      ECL_DB_PASSWORD: "${ECL_DB_PASSWORD:?Set ECL_DB_PASSWORD}"
      EXPENDITURE_RESOLUTION_DB_URL: "${EXPENDITURE_RESOLUTION_DB_URL:?Set EXPENDITURE_RESOLUTION_DB_URL}"
      EXPENDITURE_RESOLUTION_DB_USER: "${EXPENDITURE_RESOLUTION_DB_USER:?Set EXPENDITURE_RESOLUTION_DB_USER}"
      EXPENDITURE_RESOLUTION_DB_PASSWORD: "${EXPENDITURE_RESOLUTION_DB_PASSWORD:?Set EXPENDITURE_RESOLUTION_DB_PASSWORD}"
      INTERNAL_AUDIT_DB_URL: "${INTERNAL_AUDIT_DB_URL:?Set INTERNAL_AUDIT_DB_URL}"
      INTERNAL_AUDIT_DB_USER: "${INTERNAL_AUDIT_DB_USER:?Set INTERNAL_AUDIT_DB_USER}"
      INTERNAL_AUDIT_DB_PASSWORD: "${INTERNAL_AUDIT_DB_PASSWORD:?Set INTERNAL_AUDIT_DB_PASSWORD}"
      JOURNAL_LEDGER_DB_URL: "${JOURNAL_LEDGER_DB_URL:?Set JOURNAL_LEDGER_DB_URL}"
      JOURNAL_LEDGER_DB_USER: "${JOURNAL_LEDGER_DB_USER:?Set JOURNAL_LEDGER_DB_USER}"
      JOURNAL_LEDGER_DB_PASSWORD: "${JOURNAL_LEDGER_DB_PASSWORD:?Set JOURNAL_LEDGER_DB_PASSWORD}"
      LOAN_DB_URL: "${LOAN_DB_URL:?Set LOAN_DB_URL}"
      LOAN_DB_USER: "${LOAN_DB_USER:?Set LOAN_DB_USER}"
      LOAN_DB_PASSWORD: "${LOAN_DB_PASSWORD:?Set LOAN_DB_PASSWORD}"
      MASTER_DATA_DB_URL: "${MASTER_DATA_DB_URL:?Set MASTER_DATA_DB_URL}"
      MASTER_DATA_DB_USER: "${MASTER_DATA_DB_USER:?Set MASTER_DATA_DB_USER}"
      MASTER_DATA_DB_PASSWORD: "${MASTER_DATA_DB_PASSWORD:?Set MASTER_DATA_DB_PASSWORD}"
      PAYABLE_DB_URL: "${PAYABLE_DB_URL:?Set PAYABLE_DB_URL}"
      PAYABLE_DB_USER: "${PAYABLE_DB_USER:?Set PAYABLE_DB_USER}"
      PAYABLE_DB_PASSWORD: "${PAYABLE_DB_PASSWORD:?Set PAYABLE_DB_PASSWORD}"
      RECEIVABLE_DB_URL: "${RECEIVABLE_DB_URL:?Set RECEIVABLE_DB_URL}"
      RECEIVABLE_DB_USER: "${RECEIVABLE_DB_USER:?Set RECEIVABLE_DB_USER}"
      RECEIVABLE_DB_PASSWORD: "${RECEIVABLE_DB_PASSWORD:?Set RECEIVABLE_DB_PASSWORD}"
      RECONCILIATION_DB_URL: "${RECONCILIATION_DB_URL:?Set RECONCILIATION_DB_URL}"
      RECONCILIATION_DB_USER: "${RECONCILIATION_DB_USER:?Set RECONCILIATION_DB_USER}"
      RECONCILIATION_DB_PASSWORD: "${RECONCILIATION_DB_PASSWORD:?Set RECONCILIATION_DB_PASSWORD}"
      REPORTING_DB_URL: "${REPORTING_DB_URL:?Set REPORTING_DB_URL}"
      REPORTING_DB_USER: "${REPORTING_DB_USER:?Set REPORTING_DB_USER}"
      REPORTING_DB_PASSWORD: "${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD}"
      TAX_DB_URL: "${TAX_DB_URL:?Set TAX_DB_URL}"
      TAX_DB_USER: "${TAX_DB_USER:?Set TAX_DB_USER}"
      TAX_DB_PASSWORD: "${TAX_DB_PASSWORD:?Set TAX_DB_PASSWORD}"
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./postgres/runtime:/account-runtime:ro
    healthcheck:
      test: ["CMD", "sh", "/account-runtime/check-external-databases.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [account-network]

  account-mart-api: {depends_on: *external-db-dependency}
  account-mart-batch: {depends_on: *external-db-dependency}
  asset-lease-api: {depends_on: *external-db-dependency}
  asset-lease-batch: {depends_on: *external-db-dependency}
  auth-api: {depends_on: *external-db-dependency}
  budget-api: {depends_on: *external-db-dependency}
  budget-batch: {depends_on: *external-db-dependency}
  closing-api: {depends_on: *external-db-dependency}
  closing-batch: {depends_on: *external-db-dependency}
  deposit-api: {depends_on: *external-db-dependency}
  deposit-batch: {depends_on: *external-db-dependency}
  ecl-api: {depends_on: *external-db-dependency}
  ecl-batch: {depends_on: *external-db-dependency}
  expenditure-resolution-api: {depends_on: *external-db-dependency}
  expenditure-resolution-batch: {depends_on: *external-db-dependency}
  internal-audit-api: {depends_on: *external-db-dependency}
  journal-ledger-api: {depends_on: *external-db-dependency}
  journal-ledger-batch: {depends_on: *external-db-dependency}
  loan-api: {depends_on: *external-db-dependency}
  loan-batch: {depends_on: *external-db-dependency}
  master-data-api: {depends_on: *external-db-dependency}
  master-data-batch: {depends_on: *external-db-dependency}
  payable-api: {depends_on: *external-db-dependency}
  payable-batch: {depends_on: *external-db-dependency}
  receivable-api: {depends_on: *external-db-dependency}
  receivable-batch: {depends_on: *external-db-dependency}
  reconciliation-api: {depends_on: *external-db-dependency}
  reconciliation-batch: {depends_on: *external-db-dependency}
  reporting-api: {depends_on: *external-db-dependency}
  reporting-batch: {depends_on: *external-db-dependency}
  tax-api: {depends_on: *external-db-dependency}
  tax-batch: {depends_on: *external-db-dependency}

networks:
  account-network:
    name: ${ACCOUNT_NETWORK_NAME:-account-dev-network}
    driver: bridge
