# [초보자를 위한 개념 설명]
# docker-compose.yml은 긴 docker run 명령을 파일로 기록한 것입니다.
version: '3.8'

services:
  config-server:
    # 루트 Gradle 멀티모듈과 config-repo가 모두 필요하므로 상위 폴더를 build context로 사용합니다.
    build:
      context: ..
      dockerfile: Containerfile
      args:
        GRADLE_PROJECT: ":config-server"
        JAR_DIRECTORY: config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - SPRING_PROFILES_ACTIVE=native
      - CONFIG_REPO_LOCATION=file:/config-repo
    # 로컬 편집 내용을 재빌드 없이 읽되 컨테이너가 설정 원본을 바꾸지 못하도록 read-only로 마운트합니다.
    volumes:
      - ../config-repo:/config-repo:ro
    networks:
      - account-network

networks:
  account-network:
    external: true # 먼저 docker network create account-network를 한 번 실행합니다.
