# ==============================================================================
# 로컬 개발 환경(native) 전용 Spring Cloud Config Server 설정 (Local File Backend)
# ==============================================================================
# [아키텍처 및 생산성 이점 - 상세 교육 가이드]
# 1. 로컬 격리 개발 환경 (Isolated Local Development):
#    - 인터넷 연결이나 외부 Git 저장소 인증 없이 로컬 파일시스템(`file:./config-repo`)에서
#      설정 파일(application-dev.yml 등)을 직접 읽어와 빠르게 테스트할 수 있습니다.
# 2. 즉각적인 설정 적용 (Instant Feedback Loop):
#    - Git commit/push 과정 없이 파일 수정 후 즉시 설정 변경 사항을 검증할 수 있습니다.
# 3. Docker 컨테이너 환경 주입 지원:
#    - Docker Compose 환경에서는 `CONFIG_REPO_LOCATION=file:/config-repo`와 같이
#      볼륨 마운트 경로를 유연하게 탐색 경로로 변경할 수 있습니다.
# ==============================================================================

spring:
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo}
