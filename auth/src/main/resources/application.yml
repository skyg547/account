spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false
    vault:
      enabled: false

eureka:

  client:
    enabled: false

auth:
  persistence:
    mode: ${AUTH_PERSISTENCE_MODE:jpa}
  internal-api:
    token: ${AUTH_INTERNAL_API_TOKEN:local-internal-auth-token}
  master-data:
    enabled: ${AUTH_MASTER_DATA_ENABLED:false}
    base-url: ${AUTH_MASTER_DATA_BASE_URL:http://localhost:8082}

  login-security:
    max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    lock-duration-minutes: ${AUTH_LOGIN_LOCK_DURATION_MINUTES:15}
    store: ${AUTH_LOGIN_SECURITY_STORE:memory}
  jwt:
    secret: ${AUTH_JWT_SECRET:modern-account-system-super-secret-key-1234567890}
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}
  users:
    - username: ${AUTH_DEFAULT_USERNAME:admin}
      password: ${AUTH_DEFAULT_PASSWORD:1234}
      department-code: ${AUTH_DEFAULT_DEPARTMENT_CODE:FIN}
      active: true
      locked: false
      roles:
        - ROLE_ADMIN
