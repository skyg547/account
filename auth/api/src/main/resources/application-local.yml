spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    loadbalancer:
      enabled: false
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false

auth:
  persistence:
    mode: jpa
  master-data:
    enabled: false
  login-security:
    store: jpa
  users: []
