# ==============================================================================
# Auth API Module - Base Configuration
# ==============================================================================
# [Architecture & Pedagogical Explanation]
# 1. Fail-Closed Security Alignment (보안 실패 기본 차단 정합성)
#    - 본 기본(base) 구성 파일은 AUTH_JWT_SECRET 및 AUTH_INTERNAL_API_TOKEN과 같은 필수 민감 정보에
#      하드코딩된 기본값(Fallback Default)을 명시적으로 포함하지 않습니다.
#    - 모든 프로파일에서 실행자가 외부 환경 변수로 자격증명을 전달하지 않으면 애플리케이션 구동 시점
#      (@PostConstruct)에 Fail-Closed 실패를 야기하여 안전을 보장합니다.
#
# 2. Runtime Credential Isolation (민감 정보 격리)
#    - application-local.yml은 H2와 외부 control-plane 비활성화만 소유합니다.
#    - 로컬 JWT secret, internal token, 사용자 비밀번호도 저장소 기본값을 두지 않고 실행 시 임시 주입합니다.
# ==============================================================================

spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false
    vault:
      enabled: false

eureka:
  client:
    enabled: false

auth:
  persistence:
    mode: ${AUTH_PERSISTENCE_MODE:jpa}
  internal-api:
    token: ${AUTH_INTERNAL_API_TOKEN:}
  master-data:
    enabled: ${AUTH_MASTER_DATA_ENABLED:false}
    base-url: ${AUTH_MASTER_DATA_BASE_URL:http://localhost:8082}

  login-security:
    max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    lock-duration-minutes: ${AUTH_LOGIN_LOCK_DURATION_MINUTES:15}
    store: ${AUTH_LOGIN_SECURITY_STORE:memory}
  sso:
    enabled: ${AUTH_SSO_ENABLED:false}
    default-provider: ${AUTH_SSO_DEFAULT_PROVIDER:local}
  otp:
    enabled: ${AUTH_OTP_ENABLED:false}
    algorithm: ${AUTH_OTP_ALGORITHM:HmacSHA1}
    digits: ${AUTH_OTP_DIGITS:6}
    period-seconds: ${AUTH_OTP_PERIOD_SECONDS:30}
    tolerance-steps: ${AUTH_OTP_TOLERANCE_STEPS:1}
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}
  users: []
