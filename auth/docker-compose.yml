version: '3.8'

services:
  auth:
    build:
      context: ..
      dockerfile: Containerfile
      args:
        GRADLE_PROJECT: ":auth:api"
        JAR_DIRECTORY: auth/api
    container_name: auth
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL:?set AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER:?set AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CLOUD_DISCOVERY_ENABLED=false
      - SPRING_CLOUD_LOADBALANCER_ENABLED=false
      - SPRING_CLOUD_VAULT_ENABLED=false
      - EUREKA_CLIENT_ENABLED=false
      # 미지정 시 Spring Boot 기본값(localhost)으로 접속을 시도해 실제 Redis 컨테이너를 못 찾던 문제 수정
      - SPRING_DATA_REDIS_HOST=account-redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - account-network

networks:
  account-network:
    external: true
